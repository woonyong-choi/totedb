name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-db-queue-experiment:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'local-db-queue-experiment')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCHMARK: '0'
      SANITIZE: ''
      PYTHONPATH: python:.local/runs/local-db-comparison/deps-queue
      TOTEDB_LIB: ${{ github.workspace }}/build/lib/libtotedb.so
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned actual database and queue packages
        run: |
          mkdir -p build
          python -m pip install 'pytest==8.4.2'
          python -m pip install --target .local/runs/local-db-comparison/deps-queue --report build/local-comparison-install.json -r docs/experiments/local-db-comparison/requirements.txt
          python -m pip freeze > build/local-comparison-freeze.txt
      - name: Verify unchanged product source and build without instrumentation
        run: |
          git diff --exit-code a86cf241255ad06aba2010c3a8b35ff98633a841 HEAD -- src include Makefile python setup.py pyproject.toml
          make BENCHMARK=0 SANITIZE= all
          python tools/verify_benchmark.py build/lib/libtotedb.so
          echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Check benchmark failure handling before collection
        run: python -m pytest -q tests/test_local_db_compare.py tests/test_python_queue_compare.py
      - name: Record the measurement host before collection
        run: |
          uname -a > build/local-comparison-uname.txt
          lscpu --json > build/local-comparison-cpu.json
          cat /proc/meminfo > build/local-comparison-memory.txt
          python -c 'import json,os,time; from pathlib import Path; Path("build/local-comparison-before.json").write_text(json.dumps({"utc":time.time(),"load":os.getloadavg(),"cpu_count":os.cpu_count(),"filesystem":list(os.statvfs("build"))})+"\n")'
      - name: Measure local SQL and KV primitives
        run: |
          DEPS="$PWD/.local/runs/local-db-comparison/deps-queue"
          python bench/local_db_compare.py collect --output build/local-db-comparison --run-id "$RUN_ID" --library build/lib/libtotedb.so --deps "$DEPS" --requirements-lock docs/experiments/local-db-comparison/requirements.txt
      - name: Measure actual SQLite-backed Python queues
        if: ${{ !cancelled() }}
        run: python bench/python_queue_compare.py collect --output build/python-queue-comparison
      - name: Verify and regenerate database measurements
        if: ${{ !cancelled() }}
        run: python bench/local_db_compare.py verify --output build/local-db-comparison
      - name: Verify and regenerate queue measurements
        if: ${{ !cancelled() }}
        run: python bench/python_queue_compare.py verify --output build/python-queue-comparison
      - name: Record the measurement host after collection
        if: always()
        run: python -c 'import json,os,time; from pathlib import Path; Path("build/local-comparison-after.json").write_text(json.dumps({"utc":time.time(),"load":os.getloadavg(),"cpu_count":os.cpu_count()})+"\n")'
      - name: Preserve raw databases, package provenance and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-db-queue-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            build/local-db-comparison/
            build/python-queue-comparison/
            build/local-comparison-install.json
            build/local-comparison-freeze.txt
            build/local-comparison-uname.txt
            build/local-comparison-cpu.json
            build/local-comparison-memory.txt
            build/local-comparison-before.json
            build/local-comparison-after.json
            build/lib/
            build/.build-fingerprint

  release-cost-experiment:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-cost-experiment')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCHMARK: '0'
      SANITIZE: ''
      OUTPUT: build/release-cost
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install experiment dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3 python3-pytest
      - name: Check collection and evidence failure handling before measurements
        run: python3 -m pytest -q tests/test_release_cost.py
      - name: Verify unchanged release product source and preregistered plan
        run: |
          git diff --exit-code d79ad8c86dcac985f7df5138d646bd1e8a2b3ee3 HEAD -- src include Makefile python setup.py
          git merge-base --is-ancestor d2400865 HEAD
          echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Collect and verify separate native, YCSB and queue observations
        run: bash docs/experiments/release-cost/run.sh all
      - name: Preserve complete evidence including failed databases
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-cost-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            build/release-cost/
            build/queue-contention/runs/
            build/ycsb/
            build/lib/
            build/counter_driver
            build/.build-fingerprint
            build-benchmark/lib/
            build-benchmark/counter_driver
            build-benchmark/.build-fingerprint

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3 python3-pytest python3-pip
          python3 -m pip install --user 'setuptools>=77'
      - name: Build and test with a separate sanitizer runtime
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          if [ "$SANITIZER" = thread ]; then
            make SANITIZE=thread test-transaction test-session test-ack-queue
          else
            make SANITIZE="$SANITIZER" test-all test-runner test-fault test-result
            make SANITIZE="$SANITIZER" test-benchmark
          fi
      - name: Preserve test outcomes, seeds and raw output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fault-evidence-${{ matrix.sanitizer }}
          path: build/fault/
          if-no-files-found: warn

  pg-compat:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: compat_test
          POSTGRES_USER: compat
          POSTGRES_PASSWORD: compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compat -d compat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client and pytest
        run: sudo apt-get update && sudo apt-get install -y postgresql-client python3-pytest
      - name: Compare the SQL engine with SQLite and PostgreSQL 18
        run: |
          python3 -m pip install --user 'psycopg[binary]'
          psql postgresql://compat:compat@localhost:5432/compat_test -c \
            "CREATE DATABASE sqldiff TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C' ENCODING 'UTF8'"
          make SANITIZE= test-sql-diff SQLDIFF_DSN=postgresql://compat:compat@localhost:5432/sqldiff
      - name: Compare two-session behavior with SQLite 3.51.0
        run: make SANITIZE= BUILD_DIR=build-sqlite test-sqlite-session-diff

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  queue-contention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Python contract reference dependencies
        run: python3 -m pip install pytest 'persist-queue==1.1.0'
      - name: Build the public Python library
        run: make SANITIZE= all
      - name: Check Python contracts including the reference adapter
        run: make SANITIZE= test-ack-queue-python
      - name: Check queue semantics, concurrent trials and evidence verification
        run: python3 -m unittest discover -s tests -p 'test_queue*.py' -v
      - name: Preserve queue contention checks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: queue-contention-checks
          path: build/queue-contention/tests/
          if-no-files-found: warn

  ycsb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Test both bindings with the official YCSB client
        run: |
          python3 bench/ycsb/run.py build
          python3 bench/ycsb/run.py test --output build/ycsb/checks
      - name: Preserve binding checks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ycsb-binding-checks
          path: build/ycsb/checks/
          if-no-files-found: warn

  benchmark-comparison:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark-comparison')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASELINE_ROOT: ${{ github.workspace }}.wt/text-range-before
      CHANGED_ROOT: ${{ github.workspace }}
      QUEUE_ROOT: ${{ github.workspace }}.wt/queue-contention
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev python3
      - name: Prepare fixed source worktrees
        run: |
          git worktree add --detach "$BASELINE_ROOT" 04f9f2d14d94da7284b90b60370ded5ebefab65c
          git worktree add --detach "$QUEUE_ROOT" f7dd4a57c2d6455036f8047d2423bd03d0e9d6b8
          echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Record VM environment and source identities
        run: |
          python3 - <<'PYTHON'
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          roots = {
              name: Path(os.environ[name])
              for name in ("BASELINE_ROOT", "CHANGED_ROOT", "QUEUE_ROOT")
          }
          evidence = {
              "ts_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_id": os.environ["RUN_ID"],
              "cpu_count": os.cpu_count(),
              "load_average": os.getloadavg(),
              "meminfo": Path("/proc/meminfo").read_text(),
              "runner": {
                  key: os.environ.get(key)
                  for key in (
                      "ImageOS",
                      "ImageVersion",
                      "RUNNER_ARCH",
                      "RUNNER_OS",
                      "GITHUB_RUN_ID",
                      "GITHUB_RUN_ATTEMPT",
                  )
              },
              "uname": subprocess.check_output(["uname", "-a"], text=True),
              "lscpu": subprocess.check_output(["lscpu", "--json"], text=True),
              "sources": {
                  name: subprocess.check_output(
                      ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
                  ).strip()
                  for name, root in roots.items()
              },
          }
          for root, experiment in (
              (roots["CHANGED_ROOT"], "text-range"),
              (roots["QUEUE_ROOT"], "queue-contention"),
          ):
              path = root / "docs/experiments" / experiment / "machine.json"
              path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PYTHON
      - name: Complete all builds before measurement
        id: builds
        run: |
          python3 "$BASELINE_ROOT/bench/ycsb/run.py" build
          python3 "$CHANGED_ROOT/bench/ycsb/run.py" build
          make -C "$QUEUE_ROOT" SANITIZE= all
      - name: Collect and verify five paired TEXT comparisons
        id: text
        run: bash docs/experiments/text-range/run.sh all
      - name: Collect and verify 360 queue trials and 72 preflights
        id: queue
        if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        run: bash "$QUEUE_ROOT/docs/experiments/queue-contention/run.sh" all
      - name: Profile the changed YCSB source after formal collection
        id: text_profile
        if: ${{ !cancelled() && steps.text.outcome == 'success' && steps.queue.outcome == 'success' }}
        continue-on-error: true
        run: |
          profile_id="$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=7 HEAD)-profile"
          python3 bench/ycsb/run.py profile --output docs/experiments/text-range \
            --run-id "$profile_id" --sizes 10000 --workloads E --threads 1 \
            --operations 1000 --repetitions 1
      - name: Profile the fixed queue source after formal collection
        id: queue_profile
        if: ${{ !cancelled() && steps.text.outcome == 'success' && steps.queue.outcome == 'success' }}
        continue-on-error: true
        run: |
          profile_id="$(date -u +%Y%m%dT%H%M%SZ)-$(git -C "$QUEUE_ROOT" rev-parse --short=7 HEAD)-profile"
          RUN_ID="$profile_id" bash "$QUEUE_ROOT/docs/experiments/queue-contention/run.sh" profile
      - name: Reverify both formal evidence sets after diagnostics
        if: ${{ !cancelled() && steps.text.outcome == 'success' && steps.queue.outcome == 'success' }}
        run: |
          data_run_id="$RUN_ID"
          RUN_ID="$data_run_id-final-check" DATA_RUN_ID="$data_run_id" bash docs/experiments/text-range/run.sh verify
          RUN_ID="$data_run_id-final-check" bash "$QUEUE_ROOT/docs/experiments/queue-contention/run.sh" verify
      - name: Preserve TEXT comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: text-range-linux-comparison
          path: docs/experiments/text-range/
          if-no-files-found: warn
      - name: Preserve queue comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: queue-contention-linux-comparison
          path: |
            ${{ env.QUEUE_ROOT }}/docs/experiments/queue-contention/
            docs/experiments/queue-contention/linux-design.md
          if-no-files-found: warn
      - name: Preserve failed TEXT comparison databases
        if: ${{ always() && (steps.text.outcome != 'success' || steps.text_profile.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: text-range-linux-failed-databases
          path: |
            ${{ env.BASELINE_ROOT }}/build/ycsb/runs/
            ${{ env.CHANGED_ROOT }}/build/ycsb/runs/
          if-no-files-found: warn
      - name: Preserve failed queue comparison databases
        if: ${{ always() && (steps.queue.outcome != 'success' || steps.queue_profile.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: queue-contention-linux-failed-databases
          path: ${{ env.QUEUE_ROOT }}/build/queue-contention/runs/
          if-no-files-found: warn

  queue-cost-experiment:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'queue-cost-experiment') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COST_BASELINE: ${{ github.workspace }}.wt/queue-cost-baseline
      COST_OUTPUT: ${{ github.workspace }}/.local/runs/queue-cost
      BASELINE_SHA: 9b212d68542ed24c6ead62eb9fdad62a174e2f2b
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install native diagnostic tools
        run: |
          mkdir -p "$COST_OUTPUT"
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev strace linux-tools-generic linux-tools-common
          perf_binary="$(python3 - <<'PY'
          from bench.queue_contention.diagnose import find_perf
          path = find_perf()
          if path is not None:
              print(path)
          PY
          )"
          printf '%s\n' "$perf_binary" > "$COST_OUTPUT/perf-discovery.txt"
          if [ -n "$perf_binary" ] && "$perf_binary" --version > "$COST_OUTPUT/perf-version.txt" 2>&1; then
            echo "COST_PERF=$perf_binary" >> "$GITHUB_ENV"
          else
            echo 'COST_PERF=/unavailable/perf' >> "$GITHUB_ENV"
          fi
          sudo sysctl -w kernel.perf_event_paranoid=1 2>&1 | tee "$COST_OUTPUT/perf-permission.txt" || true
          if [ -n "$perf_binary" ]; then
            "$perf_binary" stat -e cpu-clock:u -- true > "$COST_OUTPUT/perf-capability-stdout.txt" 2> "$COST_OUTPUT/perf-capability-stderr.txt" || true
          fi
      - name: Prepare the pinned baseline worktree
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$BASELINE_SHA" origin/main
          git worktree add --detach "$COST_BASELINE" "$BASELINE_SHA"
          test "$(git -C "$COST_BASELINE" rev-parse HEAD)" = "$BASELINE_SHA"
      - name: Build both libraries before any collection
        id: build
        run: |
          make -C "$COST_BASELINE" -j2 SANITIZE= CC='cc -fno-omit-frame-pointer' all > "$COST_OUTPUT/baseline-build.txt" 2>&1
          make -j2 SANITIZE= CC='cc -fno-omit-frame-pointer' all > "$COST_OUTPUT/candidate-build.txt" 2>&1
          sha256sum "$COST_BASELINE/build/lib/libtotedb.so" "$GITHUB_WORKSPACE/build/lib/libtotedb.so" > "$COST_OUTPUT/libraries.sha256"
          git -C "$COST_BASELINE" status --porcelain > "$COST_OUTPUT/baseline-status.txt"
          git -C "$COST_BASELINE" rev-parse HEAD > "$COST_OUTPUT/baseline-head.txt"
          git rev-parse HEAD > "$COST_OUTPUT/candidate-head.txt"
          printf '%s\n' "CC=cc -fno-omit-frame-pointer; shared recipe: -O2 -g -fPIC; SANITIZE=" > "$COST_OUTPUT/shared-flags.txt"
      - name: Check diagnostic correctness with small jobs
        run: python3 -m unittest discover -s tests -p test_queue_diagnose.py -v
      - name: Collect paired uninstrumented trials
        run: |
          python3 bench/queue_contention/diagnose.py compare \
            --baseline-lib "$COST_BASELINE/build/lib/libtotedb.so" \
            --candidate-lib "$GITHUB_WORKSPACE/build/lib/libtotedb.so" \
            --output "$COST_OUTPUT/compare" --jobs 4096 --repetitions 5 --workers 1,8
      - name: Trace ToteDB separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 bench/queue_contention/diagnose.py trace \
            --library "$GITHUB_WORKSPACE/build/lib/libtotedb.so" --engine totedb \
            --output "$COST_OUTPUT/trace-totedb" --jobs 4096 --workers 8 --perf "$COST_PERF"
      - name: Trace SQLite WAL separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 bench/queue_contention/diagnose.py trace \
            --library "$GITHUB_WORKSPACE/build/lib/libtotedb.so" --engine sqlite-wal \
            --output "$COST_OUTPUT/trace-sqlite-wal" --jobs 4096 --workers 8 --perf "$COST_PERF"
      - name: Recheck final library hashes
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: sha256sum -c "$COST_OUTPUT/libraries.sha256" > "$COST_OUTPUT/final-hashes.txt" 2>&1
      - name: Preserve queue cost evidence and all databases
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: queue-cost-hypotheses
          include-hidden-files: true
          path: |
            .local/runs/queue-cost/
            .local/runs/queue-diagnose-tests/
          if-no-files-found: warn
