<script>
(() => {
  const root = document.documentElement;
  const apply = (mode) => {
    if (mode === 'light' || mode === 'dark') {
      root.setAttribute('data-theme', mode);
      root.style.colorScheme = mode;
    } else {
      root.removeAttribute('data-theme');
      root.style.colorScheme = '';
    }
  };
  if (window.self === window.top) {
    const saved = () => {
      try {
        return localStorage.getItem('diagramplay-theme');
      } catch {
        return null;
      }
    };
    apply(saved());
    addEventListener('storage', (e) => e.key === 'diagramplay-theme' && apply(saved()));
    return;
  }
  root.classList.add('embedded');
  const reportHeight = () => parent.postMessage({ figureHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  addEventListener('message', (e) => {
    if (e.source !== parent || !e.data || !('theme' in e.data)) return;
    apply(e.data.theme);
    requestAnimationFrame(reportHeight);
  });
  parent.postMessage({ themeRequest: true }, '*');
  addEventListener('load', () => new ResizeObserver(reportHeight).observe(document.body));

@media (prefers-reduced-motion: reduce) { .app-toolbar { transition: none; } }
/* 재생기 틀, 도구 막대, 장면 탭. iframe 안(html.embedded)에서는 테두리와 바깥 여백을 뺀다. */
/* 컨테이너는 가용 폭을 따르고 도표는 그 폭을 꽉 채운다. 문서 안에서는 가로로 스크롤하지 않고, 전체화면 확대에서만 끌어 옮긴다. */

body {
  margin: 0;
  padding: var(--spacing-12) var(--spacing-6);
  font-family: var(--font-figure-sans);
  letter-spacing: var(--tracking-text);
  color: var(--color-ink);
  background: var(--color-ui-card);
}

/* 본문이나 목록 카드에 삽입된 재생기(iframe)는 둘러싼 면 위에 그대로 놓인다. 바탕을 칠하지 않고 바깥 여백이 없어 그림이 본문 흐름에 붙는다. */
html.embedded { overflow: clip; }

html.embedded body {
  padding: 0;
  background: transparent;
}

/* 그림 틀은 모든 곳(단독, 삽입, 전체 화면)에서 같은 열 하나다: 그림 면(.fl-surface) 다음에 장면 탭 줄(.fl-foot)이 문서 흐름대로 이어진다. 탭은 그림 위로 올라가지 않는다.
   단독 문서와 삽입 재생기 모두 자연 높이를 쓰고 문서가 세로로 스크롤한다. */
.fl-figure {
  position: relative;
  display: flex;
  flex-direction: column;
  max-width: var(--figure-canvas, var(--spacing-figure-figure-canvas));
  margin: 0 auto;
  overflow: clip;
  color: var(--color-ink);
  background: var(--color-ui-card);
  border-radius: 0;
}

html.embedded .fl-figure {
  max-width: none;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}

html.embedded .fl-figure.full {
  background: var(--color-ui-card);
}

/* 그림의 바탕은 SVG와 같다. 도구 막대는 이 면 위 오른쪽 위에 뜬다. */
.fl-surface {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  background: var(--color-figure-canvas);
}

/* 문서 안에서는 자연 높이를 쓰고 가로로 넘치지 않는다(판 묶음이 폭을 채운다). 전체 화면에서는 양쪽 축으로 이동한다. */
.fl-canvas {
  min-height: 0;
  padding: var(--spacing-3) 0;
  overflow-x: clip;
  background: var(--color-figure-canvas);
  border-radius: var(--radius-card-radius);
}

.fl-canvas:focus-visible {
  outline: var(--outline-width-focus) solid var(--color-ui-focus);
  outline-offset: calc(-1 * var(--border-width-tag));
}

/* 판 묶음은 그림 면의 폭을 꽉 채운다. 넓은 그림은 줄고 좁은 그림은 커지며, 문서 안에서 가로로 스크롤하지 않는다. 판끼리의 폭 비율은 아래 판 SVG의 --panel-w / --view-w가 지킨다. */
.dp-panels {
  width: 100%;
  margin: 0 auto;
}

.dp-panel > svg {
  display: block;
  width: calc(100% * var(--panel-w) / var(--view-w));
  height: auto;
  margin: 0 auto;
}

/* 마커 정의만 담은 보이지 않는 SVG. 판 SVG들이 이 정의를 문서 id로 쓴다. */
.dp-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

/* 장면이 둘 이상일 때만 보이는 탭 줄이다(없으면 hidden). 그림 면 바로 아래 문서 흐름에 놓인 가운데 줄이고 그림을 덮지 않는다.
   문서 안에서는 틀 높이가 정해지지 않아 백분율 상한이 걸리지 않는다. 전체 화면에서 탭이 그림 공간을 모두 차지하지 않도록 틀 높이의 절반까지만 자라고 넘치면 안에서 스크롤한다. */
.fl-foot {
  display: flex;
  flex: 0 0 auto;
  justify-content: center;
  box-sizing: border-box;
  max-height: 50%;
  padding: 0;
  overflow: auto;
}

/* 탭 줄은 틀 폭 안에서 줄을 바꾸고(폭 규칙은 tabs.css의 공통 탭) 가운데로 모은다. 부모 flex 안에서 내용 폭 밑으로 줄어들 수 있어야 긴 탭이 틀 밖으로 나가지 않는다. */
.fl-foot > .app-tablist {
  justify-content: center;
  min-width: 0;
}

/* 전체 화면은 같은 틀을 창 전체로 키우는 것뿐이다. 문서 안에서는 자연 높이이고 전체 화면에서만 창 높이를 채운다. */
.fl-figure.full {
  position: fixed;
  inset: 0;
  z-index: var(--z-index-overlay);
  max-width: none;
  border-radius: 0;
}

.fl-figure.full .fl-canvas {
  position: relative;
  display: block;
  flex: 1;
  min-height: 0;
  padding: 0;
  overflow: auto;
  touch-action: none;
  user-select: none;
}

/* 전체 화면: 판 묶음은 그림 전체가 영역에 들어가는 폭(--fit-w, 재생기가 잰다)에 확대 배수(--zoom)를 곱한 폭이고, 영역이 넘치면 스크롤된다.
   글자를 키우는 일은 확대가 맡는다. 판 폭의 분모는 문서 안의 보기 폭이 아니라 묶음의 실제 폭(--bundle-w)이다. */
.fl-figure.full .dp-panels {
  width: calc(var(--fit-w, 100%) * var(--zoom, 1));
  max-width: none;
}

.fl-figure.full .dp-panel > svg {
  width: calc(100% * var(--panel-w) / var(--bundle-w, var(--view-w)));
}

.fl-figure.full.zoomed .fl-canvas {
  cursor: grab;
}

.fl-figure.full.zoomed .fl-canvas:active {
  cursor: grabbing;
}

/* 확대·축소는 전체 화면에서만 보인다. 문서 안에서는 그림을 그대로 보이는 편이 읽기 쉽다. 도구 막대 바로 아래에 같은 면으로 붙는다. */
.fl-zoom {
  position: absolute;
  top: calc(100% + var(--spacing-1-5));
  right: 0;
  display: none;
  flex-direction: column;
  gap: var(--spacing-0-5);
}

.fl-figure.full .fl-zoom {
  display: flex;
}

/* 내용이 없는 카드는 틀도 보이지 않는다(그리는 쪽이 opacity 0). 내용이 찬 카드는 중립 면과 경계 그대로이고, 지금 단계는 바깥 도형 윤곽이, 값이 바뀐 줄은 짧은 배경 면이 알린다. */
.fl .fl-card.filled {
  opacity: 1;
}

.fl .fl-edge.is-current {
  color: var(--fx-edge);
}

/* 고정 라벨 알약은 늘 보인다. 점이 올라 있는 동안 알약의 테두리와 글자가 활성 색이고, 점이 떠난 뒤 재생기가 쓰는 세기(--pill-tint, 1에서 0)만큼 중립 색으로 돌아온다.
   불투명도는 건드리지 않는다. 세기는 시각마다 재생기가 정한 값이다. 켜짐과 평소 색은 figure.css의 효과 한 벌이다. */
.fl .fl-edge .pill {
  stroke: color-mix(in srgb, var(--fx-edge) calc(var(--pill-tint, 0) * 100%), var(--fx-edge-rest));
}

.fl .fl-edge .edgelabel {
  fill: color-mix(in srgb, var(--fx-ink) calc(var(--pill-tint, 0) * 100%), var(--fx-ink-rest));
}


/* 선, 도형 윤곽, 카드 내용 층, 바뀐 값의 배경 면의 켜짐과 줄어듦은 재생기가 시각마다 정한 상태라 전환을 걸지 않는다. 같은 장면, 같은 시각의 모습이 실제 시간이나 앞 기록에 따르지 않고,
   카드 내용 층은 바뀐 순간에 새 층만 보여 접근성 트리와 화면이 같다. 도착 후광(.fl-pulse)은 figure.css, 차트 표식 겹침(.fl-mark-pulse)의 칠은 chart.css가 맡는다. */

/* 조용한 선은 지금 단계에서 쓸 때만 보인다. 도형에 마우스를 올려도 켜지지 않는다. */
.fl .fl-edge.quiet:not(.on) {
  opacity: 0;
}

.fl .fl-node {
  cursor: default;
}

.fl-packet {
  pointer-events: none;
}

/* hidden 속성이 display: grid 같은 규칙에 지지 않게 한다. 장면이 하나뿐이거나 시간 흐름이 없는 그림의 빈 탭 줄을 숨기기 위해서다. */
[hidden] {
  display: none !important;
}
/* 그림 안 글자와 모양. HTML 재생기와 움직이는 SVG가 같이 쓴다. */
/* 카드 안 글(label, sub, meta, cell, item, row)의 기준 점(text-anchor)은 글이 정한다(measure/texts.js의 anchor). 여기서는 글꼴과 색만 정한다. */
/* 글 위계는 셋이다: 제목(공통 디자인.label-size 15: 카드 제목은 regular, 그룹 제목은 semibold), 문장과 이름표(detail-size 13: 부제, 선 라벨, 메모, 이동 글, 카드 줄, 제약, 형식), 작은 표시(micro-size 11: 번호, 태그, 표식, 키, 눈금, 단위). 크기와 굵기는 measure/texts.js의 STYLE이 같은 토큰으로 잰다. */
.fl text {
  font-family: var(--font-figure-sans);
  letter-spacing: var(--tracking-text);
}

.fl .label {
  font-size: var(--text-small-text);
  fill: var(--color-ink);
}

.fl .sub {
  font-size: var(--text-tiny-text);
  fill: var(--color-ui-muted);
}

.fl .frame {
  font-size: var(--text-small-text);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-group-title);
}

.fl .edgelabel {
  font-size: var(--text-tiny-text);
  text-anchor: middle;
  fill: var(--fx-ink-rest);
}

/* 카드 줄, 메모와 구획 제목 같은 덧붙임 글, 관계 그래프 이름, 표 칸, 격자 칸은 문장이라 같은 크기와 글자색이다. */
.fl .row,
.fl .meta,
.fl .mini,
.fl .cell,
.fl .item {
  font-size: var(--text-tiny-text);
  fill: var(--color-ink);
}

.fl .row.mono {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

/* 백틱으로 감싼 글. 코드 글꼴로 그린다. */
.fl .code {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
}

.fl .muted {
  fill: var(--color-ui-muted);
}

.fl .tag {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-ink);
}

.fl .mark {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-state-active-text);
}

/* 값 카드 줄의 값 글자. 줄의 이름(row)은 카드 층이 그리고 값은 오른쪽 끝에 얹힌다. 이름과 같은 크기이고 굵기만 다르다. */
.fl .value {
  font-size: var(--text-tiny-text);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-ink);
}

.fl .chip {
  font-size: var(--text-tiny-text);
  text-anchor: middle;
}

.fl .item.gap {
  fill: var(--color-ui-muted);
}

/* 열 형식(타입)은 코드 글이라 코드 글꼴의 오른쪽 열이고 이름보다 옅다. NULL 허용 여부는 키 표시(.key)와 같은 작은 표시이고, 삭제 정책은 외래 키 선의 끝 글이다. */
.fl .cell.type {
  font-family: var(--font-figure-mono);
  letter-spacing: normal;
  fill: var(--color-ui-muted);
}

/* 순서 보기의 메시지, 메모, 구획, 활성 막대는 자기 장면이 보일 때만 보인다. 자리는 늘 같아 판 크기가 변하지 않는다. */
.fl .fl-off {
  display: none;
}

.fl .fl-edge {
  color: var(--fx-line-rest);
}

.fl .fl-path {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--border-width-edge);
}

/* 열 키(PK, FK, UNQ)는 작은 표시이고 글자색이다. 파랑은 켜진 상태에만 쓴다. */
.fl .cell .key {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  fill: var(--color-ink);
}

/* 그룹은 기본 면이 없다(투명). 경계와 제목만 있고, 깊이에 따라 회색 면을 겹치지 않는다. 고른 색은 아래 appearance 역할로 적용한다. */
.fl .frame-box {
  --fx-edge-rest: var(--color-figure-outline);
  fill: none;
  stroke: var(--fx-edge-rest);
  stroke-width: var(--border-width-thin);
}

.fl .fl-card {
  fill: var(--color-ui-card);
}

.fl .fl-queue-slot {
  fill: var(--color-figure-queue-empty);
  stroke: var(--color-outline);
  stroke-width: var(--border-width-thin);
}

.fl .queue-fill .fl-queue-slot {
  fill: var(--color-data-category-1);
  stroke: var(--color-data-category-1);
}

.fl .fl-shape-external > :is(.fl-stroke, .fl-pulse),
.fl .frame-box.dashed,
.fl .fl-path.dashed {
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .lifeline {
  stroke: var(--color-line);
  stroke-width: var(--border-width-lifeline);
  stroke-dasharray: var(--dash-gap) var(--dash-gap);
}

.fl .fl-activation {
  fill: var(--color-ui-card);
  stroke: var(--color-line);
  stroke-width: var(--border-width-thin);
}

.fl .fl-destroy > circle {
  fill: var(--color-figure-canvas);
}

.fl .fl-destruction {
  fill: none;
  stroke: var(--color-line);
  stroke-width: var(--border-width-edge);
  stroke-linecap: round;
}

.fl .note-box {
  fill: var(--color-ui-card);
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

/* 알약은 모두 같은 중립 흰 면과 평소 경계다: 선 라벨, 배지와 개수. */
.fl .pill,
.fl .badge-pill {
  fill: var(--color-ui-card);
  stroke: var(--fx-edge-rest);
}

.fl .fl-mini-pill {
  stroke-width: var(--border-width-thin);
}

.fl .fl-mini-pill.fl-mini-lit {
  fill: var(--fx-row);
}

.fl .fl-edge.fl-mini-lit {
  color: var(--fx-edge);
}

.fl .part-bg {
  --fx-face: transparent;
  --fx-face-on: var(--fx-row);
  fill: var(--fx-face);
}

.fl .col-line {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-hair);
}

.fl .part-head {
  fill: var(--color-figure-canvas);
}

.fl .grid-cell {
  --fx-face: var(--color-ui-card);
  --fx-face-on: var(--fx-row);
  fill: var(--fx-face);
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-thin);
}

.fl .grid-tray {
  fill: var(--color-ui-card);
}

.fl .grid-cell.gap {
  --fx-face: var(--color-ui-card);
  stroke: var(--color-data-grid);
}

.fl .grid-cell.empty {
  --fx-face: none;
  stroke: var(--color-line);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .fl-edge.mark {
  --fx-line-rest: var(--color-ink);
}

/* 이름과 값은 평소 여백으로 구분한다. 명시한 면(face)과 값 갱신 강조만 배경을 더한다. */
.fl .face {
  fill: none;
  stroke: none;
}

/* 도형 윗줄과 그룹 제목 줄의 장식: 글자 배지, 아이콘 */
.fl .badge {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  text-anchor: middle;
  fill: var(--color-ink);
}

.fl .fl-icon {
  color: var(--color-figure-icon);
}

.fl .fl-symbol .fl-icon {
  color: inherit;
}

/* 선 번호 원. 흑백 번호이고 라벨 알약과 달리 켜져도 색이 바뀌지 않아 정지 그림과 같은 순서로 읽힌다. */
.fl .number-pill {
  fill: var(--color-figure-number-fill);
}

.fl .number {
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
  text-anchor: middle;
  fill: var(--color-figure-number-ink);
}

/* 도형은 그림자 없는 평면이다. 그림자는 떠 있는 메뉴 같은 조작에만 둔다. */
.fl :where(.fl-node) > .fl-stroke {
  stroke: var(--fx-edge-rest);
  stroke-width: var(--border-width-thin);
}

/* 구획은 border.hair, 보조 경계는 border.thin, 관계는 border.edge, 생명선은 border.lifeline, 도형 경계는 공통 디자인.node-stroke다. 모든 선은 그림과 함께 확대·축소된다. */
.fl .fl-path,
.fl .fl-node > .fl-stroke,
.fl .grid-cell,
.fl .col-line,
.fl .pill,
.fl .badge-pill {
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 화살촉과 몸통은 같은 소유자의 색을 상속한다(draw/arrow.js). 화살촉은 채운 삼각형이다. 연결선은 선 묶음이, 차트 방향선은 역할 class(.arrow-main 등, chart.css)가 소유자다.
   HTML 문서의 차트 마커 정의는 판 SVG 밖의 정의 전용 SVG에 있어 `.fl` 아래가 아니므로 이 규칙은 `.fl` 범위를 걸지 않는다. */
.fl-arrowhead {
  fill: currentColor;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 효과 한 벌: 켜짐과 평소의 모습을 정하는 유일한 정의다. 움직이는 SVG(animate/animator.js)의 keyframes와 HTML 재생기의 `.on` 규칙이 같은 `--fx-*`를 읽으므로 두 출력과 정지 그림이 늘 같다.
   - 켜짐(on): --fx-edge 윤곽·그룹 경계·선·알약 테두리, --fx-ink 알약 글자, --fx-row 표 줄과 격자 칸의 면, --fx-face-on 요소의 켜진 면(도형은 아래), --fx-flash 값이 바뀐 순간의 면.
   - 평소(rest): --fx-edge-rest 도형, 그룹, 알약의 경계, --fx-ink-rest 알약 글자, --fx-line-rest 선, --fx-face 요소의 평소 면.
   효과는 도형이 고른 색(tone)이나 표현(appearance)과 상관없다. appearance는 고른 색을 평소 값(--fx-face, --fx-edge-rest)에만 적용하고, 켜진 동안은 강조 윤곽에 자리를 내준다. */
.fl {
  --paint-fill: var(--color-ui-card);
  --paint-outline: var(--color-figure-outline);
  --paint-ink: var(--color-group-title);
  --fx-edge: var(--color-state-active);
  --fx-ink: var(--color-state-active-text);
  --fx-row: var(--color-figure-selection-fill);
  --fx-flash: var(--color-figure-flash);
  --fx-edge-rest: var(--color-figure-outline);
  --fx-ink-rest: var(--color-ui-muted);
  --fx-line-rest: var(--color-line);
}

/* 도형의 평소 면과 켜진 면. 옅은 면으로 고른 도형(filled)은 켜져도 면이 같다. 면이 없는 윤곽(fill='none')과 점은 자기 면이 없거나 자기 색이다. */
.fl .fl-node {
  --fx-face: var(--color-ui-card);
  --fx-face-on: var(--color-figure-active-surface);
}

.fl .fl-node.ap-filled {
  --fx-face: var(--paint-fill);
  --fx-face-on: var(--fx-face);
}

/* 소비자는 쓴 톤의 --paint-* 변수만 연결한다. 면·경계·제목·차트 바탕의 역할은 여기서 한 번 정한다. */
.fl .fl-node.ap-outline {
  --fx-edge-rest: var(--paint-outline);
}

.fl .fl-group.ap-filled > .frame-box {
  fill: var(--paint-fill);
}

.fl .fl-group.ap-outline > .frame-box {
  --fx-edge-rest: var(--paint-outline);
}

.fl .fl-group:is(.ap-plain, .ap-filled, .ap-outline) > .frame {
  fill: var(--paint-ink);
}

.fl .face.ap-filled {
  fill: var(--paint-fill);
}

.fl .fl-layer.ap-filled {
  --chart-ground: var(--paint-fill);
}

.fl .face.ap-outline {
  stroke: var(--paint-outline);
}

.fl .fl-shape-start {
  --fx-face: var(--color-ink);
}

.fl .fl-node > .fl-stroke[fill='none'] {
  --fx-face: none;
  --fx-face-on: none;
}

.fl :where(.fl-node) > .fl-stroke:where(:not([fill='none'])) {
  fill: var(--fx-face);
}

/* `light`가 명시한 도형: 윤곽이 강조 색이 되고 면은 옅은 강조 면이다(옅은 면으로 고른 도형은 면을 그대로 둔다). 점이 닿은 도형은 도착 후광(.fl-pulse)만 쓴다. */
.fl .fl-node.on > .fl-stroke {
  stroke: var(--fx-edge);
}

.fl .fl-node.on > .fl-stroke:not([fill='none']) {
  fill: var(--fx-face-on);
}

/* `light`가 명시한 그룹: 경계선만 강조 색이다. 굵기, 면, 모서리, 점선은 그대로다. */
.fl .fl-group.on > .frame-box {
  stroke: var(--fx-edge);
}

/* 켜진 표 줄(칸)과 격자 칸의 면. 모든 카드가 같은 규칙이다. */
.fl .fl-part.on :is(.part-bg, .grid-cell) {
  fill: var(--fx-face-on);
}

/* 도형에 마우스를 올려도 면이나 선이 켜지지 않는다(장식용 호버 활성 없음). 키보드 초점은 같은 외부 형상 위의 초점 표시이고 윤곽을 두 겹으로 만들지 않는다. */
/* 브라우저 기본 초점 링은 g 요소의 사각 상자를 두르므로 둥근 도형과 어긋난다. 어떤 방식으로 초점이 가도 기본 링을 끄고, 키보드 초점(:focus-visible)은 도형 윤곽 자체로 표시한다. */
.fl .fl-node:focus,
.fl .fl-node:focus-visible {
  outline: none;
}

.fl .fl-node:focus-visible > .fl-stroke {
  stroke: var(--color-ui-focus);
  stroke-width: var(--outline-width-focus);
}

/* 값이 바뀔 때 켜지는 배경 면. 도형과 같은 윤곽을 쓰고 테두리를 더하지 않는다. */
.fl .fl-flash-face {
  fill-opacity: var(--opacity-range);
}

.fl .fl-flash {
  fill: var(--fx-flash);
  stroke: none;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .fl .fl-flash {
    display: none;
  }
}

/* 점이 도형에 닿을 때의 테두리 후광: 도형 윤곽과 같은 모양의 겹침 선이다. 면을 칠하지 않고 선 굵기가 윤곽과 같아 도형이 커지지 않는다. 불투명도(80/80/240ms)는 SMIL이나 재생기가 정한다. */
.fl .fl-pulse {
  fill: none;
  stroke: var(--fx-edge);
  stroke-width: var(--border-width-thin);
  pointer-events: none;
}

/* 제어 구획의 경계는 관계선보다 약하며 제목 밑면은 생명선을 가린다. */
.fl .fl-fragment-border {
  fill: none;
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-thin);
}

.fl .fl-fragment-divider {
  fill: none;
  stroke: var(--color-ui-line);
  stroke-width: var(--border-width-hair);
  stroke-dasharray: var(--dash-card) var(--dash-card);
}

.fl .fl-fragment-heading {
  fill: var(--color-ui-card);
}

.fl .fl-fragment-label {
  font-weight: var(--font-weight-semibold);
}

.fl .fl-packet > circle:first-child {
  opacity: 0;
}

/* 독립 SVG도 재생 판과 같은 바탕과 움직임 줄이기 규칙을 쓴다. */
.fl .fl-canvas-surface { fill: var(--color-figure-canvas); rx: var(--radius-card-radius); }
.fl .fl-still { display: none; }
@media (prefers-reduced-motion: reduce) {
  .fl .fl-motion { display: none; }
  .fl .fl-still { display: inline; }
}
/* 차트 글자와 자라는 움직임. 차트 SVG 안에 들어가고, README 이미지에서도 보이게 되풀이한다. */
.fl .chart-label {
  font-size: var(--text-tiny-text);
  fill: var(--color-ink);
}

.fl .chart-value,
.fl .chart-tick,
.fl .chart-unit {
  font-variant-numeric: tabular-nums;
  font-size: var(--text-figure-meta);
  fill: var(--color-ui-muted);
}

.fl .chart-value {
  fill: var(--color-ink);
}

/* 글자 뒤 바탕 면과 받침 선은 차트가 놓인 면의 색이다. 차트 보기는 그림 바탕(설명 판), 차트 카드는 카드 면이다(켜진 카드는 켜진 면). 받는 쪽은 차트 묶음(.fl-chart)의 color를 currentColor로 읽는다. */
.fl {
  --chart-ground: var(--color-figure-canvas);
}

.fl .fl-node {
  --chart-ground: var(--fx-face);
}

.fl .fl-node.on {
  --chart-ground: var(--fx-face-on);
}

/* 카드 본문의 차트는 바깥 카드의 강조 면이 아니라 실제로 놓인 본문 면을 따른다. */
.fl .fl-layer {
  --chart-ground: var(--color-ui-card);
}

/* 바탕 색은 차트 묶음의 color로 내려 보낸다. 움직이는 SVG는 켜진 카드에서 이 color만 바꾸고(사용자 정의 속성 keyframes는 시작 때 값이 굳어 테마가 바뀌어도 따라가지 않는다), 받는 쪽은 currentColor로 읽는다. 차트 안에서 color를 정하는 요소(방향선 역할 class)는 받는 쪽을 감싸지 않는다. */
.fl .fl-chart {
  color: var(--chart-ground);
}

/* 값은 별도 바탕 면 위에 그려 작은 크기에서도 획이 글자 안을 덮지 않는다. */
.fl .chart-text-bg {
  fill: currentColor;
}

/* 합이 0이라 비율이 정해지지 않는 원·도넛의 빈 고리는 격자와 같은 중립 선이다. */
.fl .chart-empty {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-thin);
}

.fl .chart-tick {
  text-anchor: middle;
}

.fl .chart-unit {
  text-anchor: end;
}

.fl .chart-value.start {
  text-anchor: start;
}

.fl .chart-value.end {
  text-anchor: end;
}

/* 값 글자는 계열과 상관없이 글자색이다. 계열은 막대, 점, 띠 색으로만 전하고 강조 계열(ours, second)은 굵기로만 구분한다. */
.fl .chart-value.ours,
.fl .chart-value.second {
  font-weight: var(--font-weight-semibold);
}

.fl .chart-name.end {
  text-anchor: end;
}

.fl .chart-missing {
  font-size: var(--text-figure-meta);
  font-style: italic;
  fill: var(--color-ui-muted);
}

.fl .chart-ratio {
  font-variant-numeric: tabular-nums;
  font-size: var(--text-tiny-text);
  font-weight: var(--font-weight-semibold);
  text-anchor: end;
  fill: var(--color-ink);
}

.fl .chart-legend,
.fl .chart-name,
.fl .chart-rule-label {
  font-size: var(--text-figure-meta);
  fill: var(--color-ui-muted);
}

.fl .chart-tick.end,
.fl .chart-rule-label.end {
  text-anchor: end;
}

.fl .chart-unit.start {
  text-anchor: start;
}

/* 칸 색은 변수로 계산해 다크 모드 heat-low를 따라간다. --s는 칸 강도(0~1)다. 보간은 OKLCH라 두 끝 색 사이의 색상환을 따라 돌아(라이트: 연노랑 → 민트 → 청록 → 파랑) 두 색 그라데이션으로 읽힌다. fill 속성의 대체 색(DiagramPlay chart/oklab.js)도 같은 OKLCH 보간이다. */
.fl .chart-heat {
  fill: color-mix(in oklch, var(--color-data-heat-high) calc(var(--s) * 100%), var(--color-data-heat-low));
}

/* 누적 조각 안의 계열 번호 키. 글자색과 가장자리 색은 조각의 범주 값을 속성으로 받는다. */
.fl .chart-seg-key {
  font-variant-numeric: tabular-nums;
  font-size: var(--text-figure-meta);
  font-weight: var(--font-weight-semibold);
}

/* 끝 이름은 계열의 글자용 색(속성)으로 쓰고 값 글자와 같은 크기의 보통 굵기다(end-labels.js가 regular로 잰다). */
.fl .chart-end-label {
  font-size: var(--text-figure-meta);
}

/* 끝 이름 안내선은 계열 테두리 색(속성)의 가는 선이다. */
.fl .chart-leader {
  fill: none;
  stroke-linejoin: round;
}

/* 기대값 계열의 선과 범례 선분은 점선이다. 실제값 선에는 쓰지 않는다. */
.fl .chart-dashed {
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .chart-pattern {
  stroke: none;
}

.fl .chart-cell {
  --ink: var(--color-data-heat-ink);
  font-variant-numeric: tabular-nums;
  font-size: var(--text-figure-meta);
  text-anchor: middle;
  fill: var(--ink);
}

.fl .chart-cell.on {
  --ink: var(--color-data-heat-ink-on);
}

.fl .chart-axis,
.fl .chart-grid {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-thin);
}

.fl .chart-zero {
  stroke: var(--color-ui-muted);
  stroke-width: var(--border-width-tag);
}

.fl .chart-break {
  fill: none;
  stroke: var(--color-ui-muted);
  stroke-width: var(--border-width-tag);
}

.fl .chart-rule {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-thin);
  stroke-dasharray: var(--dash-line) var(--dash-gap);
}

.fl .chart-histogram-bin {
  clip-path: inset(0 round var(--radius-sm) var(--radius-sm) 0 0) fill-box;
}

.fl .chart-whisker,
.fl .chart-median,
.fl .chart-ci {
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-tag);
}

.fl .chart-rule-casing {
  stroke: currentColor;
  stroke-width: var(--border-width-casing);
}

.fl .chart-interval {
  fill: none;
  stroke: var(--color-data-grid);
  stroke-width: var(--border-width-edge);
}

.fl .chart-band {
  fill-opacity: var(--opacity-band);
}

/* 면적 차트의 면은 계열 색을 띠 불투명도만큼 차트 바탕(currentColor, .fl-chart가 싣는 바탕 색)에 미리 섞은 불투명 면이다. 면끼리 겹친 곳에서 반투명 색이 다시 섞여 제3의 탁한 색(노랑 위 파랑의 올리브 등)이 생기지 않고, 겹친 곳은 앞에 그린 면의 색 하나로 읽힌다. 계열 색은 --chart-area로 받는다. color-mix를 모르는 뷰어는 띠와 같은 반투명 면이다. */
.fl .chart-area {
  fill-opacity: var(--opacity-band);
}

@supports (fill: color-mix(in srgb, currentColor 50%, currentColor)) {
  .fl .chart-area {
    fill: color-mix(in srgb, var(--chart-area) calc(var(--opacity-band) * 100%), currentColor);
    fill-opacity: 1;
  }
}

.fl .chart-range {
  stroke-linecap: round;
  stroke-opacity: var(--opacity-range);
}

.fl .chart-after {
  stroke: var(--chart-boundary, currentColor);
  stroke-width: var(--border-width-tag);
}

.fl .chart-box {
  fill: var(--color-ui-card);
  stroke: var(--color-data-main);
  stroke-width: var(--border-width-tag);
}

/* 방향선(덤벨 화살표, 산점도 link)은 몸통과 화살촉이 한 덩어리로 같은 자리에서 나타난다(pop). 둥근 끝은 화살촉 꼭지의 둥근 접합과 이어진다. */
.fl .chart-arrow,
.fl .chart-link {
  stroke: currentColor;
  stroke-width: var(--border-width-strong);
  stroke-linecap: round;
}

/* 방향선의 색 역할(draw/arrow.js CHART_ARROW). 역할 class가 `color`를 한 번 정하고, 그 class를 단 몸통과 같은 class로 감싼 마커 정의(HTML 문서에서는 `.fl` 밖)가 같은 색을 읽는다. */
.arrow-main {
  color: var(--color-data-main);
}

.arrow-muted {
  color: var(--color-ui-muted);
}

/* pathLength 1인 선이 stroke-dashoffset으로 그려진다. 선 차트의 선이 쓴다. */
.fl .draw {
  stroke-dasharray: 1;
}

.fl .grow {
  transform-box: fill-box;
  transform-origin: left center;
}

.fl .grow.from-end {
  transform-origin: right center;
}

.fl .hidden {
  opacity: 0;
}

.fl .dim {
  opacity: var(--opacity-dim);
}

/* 글자는 면보다 덜 흐려, 흐린 행에서도 글자가 바탕과 대비 4.5 이상이다(opacity.dim-ink). */
.fl .ink.dim {
  opacity: var(--opacity-dim-ink);
}

/* 계열 보임과 행 흐림은 재생기가 시각마다 정한 상태라 불투명도에 전환을 걸지 않는다(같은 시각의 모습이 실제 시간이나 앞 기록에 따르지 않는다). */

/* 히트맵은 값과 색 강도의 대응을 강조 상태와 무관하게 보존한다. 밝힌 칸은 글자를 굵게 해 구분하고 면 색과 글자 색은 그대로다. */
.fl .chart-heat-cell.dim,
.fl .chart-cell.ink.dim {
  opacity: 1;
}

/* 굵게 하는 범위는 밝히지 않은 칸이 있는 그 차트 카드뿐이다(한 판의 다른 차트 카드는 받지 않는다). */
.fl [data-chart]:has(.chart-cell.dim) .chart-cell.ink:not(.dim) {
  font-weight: var(--font-weight-semibold);
}

/* 세로 막대는 원시 건수의 최종 높이를 유지하며 움직임 감소 설정을 따른다. */
@media (prefers-reduced-motion: reduce) {
  .fl .rise,
  .fl .chart-waterfall-growth {
    /* stylelint-disable-next-line declaration-no-important -- SVG의 단계별 keyframes보다 사용자 움직임 설정을 우선한다. */
    animation: none !important;
  }
}

.fl .chart-waterfall-total {
  font-weight: var(--font-weight-semibold);
}

/* 표식의 기하와 계열 효과색은 소비자가 전달하고, 겹침의 면·고리·글자 후광은 여기서 정한다. */
.fl .fl-mark-pulse {
  fill: var(--pulse-effect);
  fill-opacity: var(--opacity-halo);
  stroke: none;
  stroke-width: var(--pulse-width, var(--border-width-tag));
}

.fl .fl-mark-pulse.has-ring {
  stroke: var(--pulse-effect);
}

.fl .fl-mark-pulse.is-line {
  fill: none;
  stroke: var(--pulse-effect);
  stroke-width: var(--pulse-width, var(--border-width-edge));
}

.fl .fl-mark-pulse.is-text {
  fill: none;
  stroke: var(--pulse-effect);
  stroke-opacity: var(--opacity-halo);
  stroke-width: var(--border-width-casing);
  stroke-linejoin: round;
}
</style>
</head>
<body>

// 맞춤은 문서 안의 보기 폭(--view-w, 가장 넓은 판의 폭)과 같은 값이며 판 묶음의 실제 좌표 크기로 잰다. 같은 폭을 판 비율의 분모(--bundle-w)로 써서 판의 상대 크기는 문서 안과 같고 줄어드는 비율은 한 번뿐이다.
function layoutFull(viewer) {
  const { canvas, panels, zoom } = viewer;
  const bundle = bundleBox(panels);
  const fit = Math.min(canvas.clientWidth, (canvas.clientHeight * bundle.w) / bundle.h);
  panels.style.setProperty('--bundle-w', bundle.w);
  panels.style.setProperty('--fit-w', `${fit}px`);
  panels.style.setProperty('--zoom', zoom);
  viewer.root.classList.toggle('zoomed', zoom > 1);
}

function clearFull(viewer) {
  viewer.panels.style.removeProperty('--bundle-w');
  viewer.panels.style.removeProperty('--fit-w');
  viewer.panels.style.removeProperty('--zoom');
  viewer.root.classList.remove('zoomed');
  viewer.canvas.scrollTo(0, 0);
}

// 휠을 굴린 자리를 중심으로 확대한다. 전체 화면이 아닐 때는 문서 스크롤에 맡긴다.
function onWheel(viewer, e) {
  if (!viewer.root.classList.contains('full')) return;
  e.preventDefault();
  // 가로로만 미는 손짓은 확대·축소가 아니다.
  if (e.deltaY === 0) return;
  const { zoomStep } = viewer.metrics;
  zoomAt(viewer, e.deltaY < 0 ? zoomStep : 1 / zoomStep, { x: e.clientX, y: e.clientY });
}

function onPointerDown(viewer, e) {
  const { root, canvas } = viewer;
  const isMainButton = e.button === 0;
  if (!root.classList.contains('full') || viewer.zoom <= 1 || !isMainButton) return;
  viewer.drag = { x: e.clientX, y: e.clientY, left: canvas.scrollLeft, top: canvas.scrollTop };
  canvas.setPointerCapture(e.pointerId);
}

// 끈 거리만큼 그림을 반대로 옮긴다. 잡은 자리가 손가락 아래에 머문다.
function onPointerMove(viewer, e) {
  const { drag, canvas } = viewer;
  if (!drag) return;
  canvas.scrollLeft = drag.left - (e.clientX - drag.x);
  canvas.scrollTop = drag.top - (e.clientY - drag.y);
}

// factor만큼 확대한다. 배율은 1배(전체)에서 metrics.zoomMax배 사이다. center(화면 좌표)가 가리키던 그림 자리가 확대 뒤에도 같은 자리에 머문다. 없으면 영역 가운데다.
function zoomAt(viewer, factor, center) {
  const { canvas, panels, metrics } = viewer;
  const next = Math.min(metrics.zoomMax, Math.max(1, viewer.zoom * factor));
  const box = canvas.getBoundingClientRect();
  const at = center ?? { x: box.left + box.width / 2, y: box.top + box.height / 2 };
  const before = panels.getBoundingClientRect();
  const fraction = { x: (at.x - before.left) / before.width, y: (at.y - before.top) / before.height };
  viewer.zoom = next;
  layoutFull(viewer);
  const after = panels.getBoundingClientRect();
  canvas.scrollLeft += after.left + fraction.x * after.width - at.x;
  canvas.scrollTop += after.top + fraction.y * after.height - at.y;
}

const REVOKE_DELAY_MS = 10_000;

function bindExport(root) {
  const node = root.querySelector('script.fl-source');
  let source;
  try { const value = JSON.parse(node?.textContent); if (typeof value === 'string') source = value; } catch { /* 원본이 없거나 손상되면 복사를 숨긴다. */ }
  bindToolbar(root, {
    source,
    download: document.querySelector(`meta[name="${CANONICAL_NAME}"]`) ? downloadDocument : undefined,
  });
}

// 정본 템플릿을 풀고 칸에 같은 base64를 채워 파일로 내려보낸다. 파일은 서버 없이 만든다.
function downloadDocument() {
  const encoded = document.querySelector(`meta[name="${CANONICAL_NAME}"]`).content;
  const template = new TextDecoder().decode(Uint8Array.from(atob(encoded), (char) => char.charCodeAt(0)));
  // 칸 머리글을 조각으로 이어 만들어, 이 스크립트 글 안에는 같은 글이 따로 나오지 않는다. 그래서 템플릿에서 첫 번째로 찾은 것이 문서 머리의 칸이다.
  const head = '<meta name="' + CANONICAL_NAME + '" content="';
  const at = template.indexOf(head) + head.length;
  const text = template.slice(0, at) + encoded + template.slice(at);
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], { type: 'text/html;charset=utf-8' }));
  link.download = downloadName();
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), REVOKE_DELAY_MS);
}

// 문서 제목에서 파일 이름을 만든다. 파일 이름에 못 쓰는 글자와 공백은 줄표로 바꾼다.
function downloadName() {
  const stem = document.title.replace(/[\\/:*?"<>|\u0000-\u001f\s]+/g, '-').replace(/^[-.]+|[-.]+$/g, '');
  return `${stem || 'diagramplay'}.html`;
}

// 브라우저에서 돈다. html.js가 HTML 안에 그대로 넣는다(src/player/ 파일을 이어 붙인다).
// 시간표를 그대로 그린다. 상태를 다시 계산하지 않는다(docs/architecture.md 불변 조건).
// 이 파일은 재생기 본체다: 시작, 시계, 장면 들어가기. 역할별로 파일이 나뉜다: 시각마다의 모습(sample.js), 탭(controls.js), 그림 그리기(stage.js, values.js), 이동 곡선(curve.js), 도구 막대와 전체 화면과 확대(view.js), 문법 복사와 HTML 다운로드(export.js).
// 시계는 장면에 들어선 뒤 흐른 표시 시각 하나(clock.elapsed)다. 프레임 사이에 시간을 자르거나 버리지 않고 시작 기준 시각에서 바로 재므로 어긋남이 쌓이지 않는다.

const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');

/**
 * 재생기를 붙인다.
 * @param root `.fl-figure` 요소
 * @param data html/content.js가 만든 재생 데이터. steps는 { label, mode, speed } 객체이고 mode는 static, once, loop, speed는 양수다. 다르면 오류다.
 */
function figurePlay(root, data) {
  const player = createPlayer(root, data);
  if (document.documentElement.classList.contains('embedded')) fitEmbedded(root, data);
  figureView(root, data, bindResponsiveScene(root, player));
  document.addEventListener('visibilitychange', () => syncClock(player));
  REDUCED_MOTION.addEventListener('change', () => REDUCED_MOTION.matches && settleScene(player));
  // 시간 흐름이 없는 그림은 다 자란 모양 그대로 움직이지 않고 탭도 없다(도구 막대는 쓸 수 있다). 장면이 하나뿐이어도 탭이 없다.
  root.querySelector('.fl-foot').hidden = !data.segs.length || player.scenes.length < 2;
  if (data.segs.length) enterScene(player, 0);
}

// 본문에 삽입된 재생기(iframe)도 틀 폭을 채운다. 판이 하나뿐인 그림은 둘레 여백을 걷은 보기 영역(tight)으로 맞춘다.
// 판이 여럿이면 판 상자가 서로 이어 붙어 있어 여백을 걷지 않고 장면 폭을 그대로 쓴다.
function fitEmbedded(root, data) {
  const panels = root.querySelector('.dp-panels');
  const svgs = panels.querySelectorAll('svg.fl');
  const { tight } = data;
  const isTight = svgs.length === 1 && tight;
  if (isTight) {
    svgs[0].setAttribute('viewBox', `${tight.x} ${tight.y} ${tight.w} ${tight.h}`);
    svgs[0].style.aspectRatio = `${tight.w} / ${tight.h}`;
    svgs[0].parentElement.style.setProperty('--panel-w', tight.w);
  }
  const width = isTight ? tight.w : data.width;
  panels.style.setProperty('--view-w', width);
}

// 재생기 상태 한 덩어리. 시계, 그림, 장면 모델, 탭이 이 객체 하나로 이어진다. 장면 모델은 데이터에서 만들고, 좁은 배치로 바뀌면 그 배치의 데이터로 다시 만든다.
function createPlayer(root, data) {
  const scenes = data.segs.length ? buildScenes(data) : [];
  const player = {
    data,
    scenes,
    scene: -1,
    frame: undefined,
    stage: createStage(root, data),
    clock: createClock(),
    tabs: [],
    // 다음 프레임 요청(없으면 undefined). 시계가 흐르는 동안에만 요청하고, 멈춘 모습(정지, 한 번이 끝남, 길이 0, 가려짐)은 프레임을 요청하지 않는다.
    request: undefined,
    tick: (now) => drawFrame(player, now),
  };
  player.tabs = bindTabs(root.querySelector('.app-tablist'), (si) => selectScene(player, si));
  return player;
}

// ---- 시계 ----

/**
 * elapsed는 장면에 들어선 뒤 흐른 표시 시각(ms)이다. anchor는 흐르는 동안 `프레임 시각 - elapsed`이고, 없으면 다음 프레임의 시각이 기준이 된다(들어올 때, 다시 보일 때).
 * isPlaying은 시계가 지금 흐르는지, wantsPlay는 장면이 재생을 원하는지다. 문서가 가려지면 isPlaying만 꺼지고 다시 보이면 멈춘 자리에서 이어진다. ended는 마지막 모습에서 멈췄는지다.
 */
function createClock() {
  return { elapsed: 0, anchor: undefined, isPlaying: false, wantsPlay: false, ended: false };
}

// 프레임마다 시계를 프레임 시각에 맞추고 그 순간의 모습을 그린다. 한 번 장면은 표시 길이가 끝나면 마지막 모습에서 멈추고 더는 프레임을 요청하지 않는다.
function drawFrame(player, now) {
  const { clock } = player;
  player.request = undefined;
  if (clock.isPlaying) {
    clock.anchor ??= now - clock.elapsed;
    clock.elapsed = now - clock.anchor;
    renderScene(player);
    if (player.scenes[player.scene].mode === 'once' && clock.elapsed >= player.scenes[player.scene].presentationMs) settleScene(player);
  }
  requestFrame(player);
}

// 시계가 흐를 때만 다음 프레임을 요청한다. 이미 요청했으면 겹쳐 요청하지 않는다.
function requestFrame(player) {
  if (player.clock.isPlaying && player.request === undefined) player.request = requestAnimationFrame(player.tick);
}

// 문서가 가려지면 시계를 멈추고, 다시 보이면 멈춘 자리에서 잇는다.
function syncClock(player) {
  const { clock } = player;
  const wasPlaying = clock.isPlaying;
  clock.isPlaying = clock.wantsPlay && !document.hidden;
  if (clock.isPlaying && !wasPlaying) clock.anchor = undefined;
  requestFrame(player);
}

// 지금 시계의 모습을 그린다. 같은 시각이면 몇 번을 그려도, 어떤 시각을 거쳐 왔어도 같은 그림이다.
function renderScene(player) {
  player.frame = sampleScene(player.scenes[player.scene], player.data, player.clock.elapsed, player.clock.ended);
  paintFrame(player.stage, player.data, player.frame);
}

// ---- 장면 ----

// 장면 si로 들어간다. 언제나 시간 0, 처음 값에서 시작한다. 정지 장면과 움직임 줄이기는 곧바로 마지막 모습이고, 나머지는 곧바로 재생을 시작한다.
function enterScene(player, si) {
  const { clock } = player;
  player.scene = si;
  player.tabs.select(si);
  player.tabs.buttons[si].ownerDocument.getElementById('scene-panel').setAttribute('aria-labelledby', player.tabs.buttons[si].id);
  clock.elapsed = 0;
  clock.anchor = undefined;
  clock.ended = false;
  // 표시 길이가 0인 장면(움직임도 효과도 없는 장면)은 흘릴 시간이 없어 곧바로 마지막 모습이다. 진행률을 길이로 나누지 않는다.
  clock.wantsPlay = player.scenes[si].mode !== 'static' && !REDUCED_MOTION.matches && player.scenes[si].presentationMs > 0;
  clock.isPlaying = clock.wantsPlay && !document.hidden;
  if (clock.wantsPlay) renderScene(player);
  else settleScene(player);
  requestFrame(player);
}

// 지금 장면의 탭을 다시 누르면 아무 일도 없다. 다른 장면의 탭은 그 장면에 새로 들어간다. 장면에서 나갔다 돌아오면 처음부터다.
function selectScene(player, si) {
  if (si !== player.scene) enterScene(player, si);
}

// 지금 장면을 마지막 모습에서 멈춘다. 시계는 서고 후광과 점은 없다. 움직임 줄이기가 켜질 때, 정지 장면에 들어갈 때, 한 번 장면이 끝날 때 쓴다.
// 움직임 줄이기가 꺼져도 다시 재생하지 않는다(다음 장면에 들어갈 때까지 이 모습이다).
function settleScene(player) {
  const { clock } = player;
  if (player.scene < 0) return;
  clock.wantsPlay = false;
  clock.isPlaying = false;
  clock.ended = true;
  clock.elapsed = player.scenes[player.scene].presentationMs;
  renderScene(player);
}

// 글을 백틱 기준으로 나눠 노드 목록으로 만든다. 홀수 번째 구간(백틱 안)은 makeCode가 만든 요소에 담는다.
function richNodes(text, makeCode) {
  return text
    .split('`')
    .map((part, i) => {
      if (!part) return null;
      if (i % 2 === 0) return document.createTextNode(part);
      const code = makeCode();
      code.textContent = part;
      return code;
    })
    .filter(Boolean);
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 그림(SVG) 조각을 찾아 두고, 표본 추출기(sample.js)가 돌려준 모습을 그대로 그린다.
// 그림은 모습의 함수다. 이전 프레임, 웹 애니메이션 끝 알림, 요소 충돌에서 사건을 읽지 않고 같은 모습을 몇 번 그려도 같다.
// 도형과 그룹은 논리 id로 찾는다. 같은 카드가 여러 판에 그려지면 도형 번호(#n-번호)는 다르지만 논리 id가 같고, 모든 그림 요소가 같은 모습으로 맞춰진다.

const SVG_NS = 'http://www.w3.org/2000/svg';

// ---- 그림 조각 ----

// 논리 id 목록(번호 순서)을 { id: 번호[] }로. 같은 id가 여러 번 나오면 번호가 여럿이다.
function indicesById(ids) {
  const map = new Map();
  ids.forEach((id, i) => map.set(id, [...(map.get(id) ?? []), i]));
  return map;
}

/**
 * 그림(SVG) 조각을 한 번 찾아 둔 묶음. 점과 마지막으로 그린 모습처럼 그림 쪽에 남는 것도 여기에 둔다.
 * 판마다 SVG 한 장이고 요소 id는 판을 가로질러 하나뿐이므로, 판 묶음(.dp-panels) 전체에서 찾는다.
 */
function createStage(root, data) {
  const view = root.querySelector('.dp-panels');
  const find = (selector) => view.querySelector(selector);
  const all = (selector) => [...view.querySelectorAll(selector)];
  return {
    view,
    metrics: data.metrics,
    edgePanels: data.edgePanels,
    trackPanels: data.trackPanels,
    chartMeta: data.chartMeta,
    cardCounts: data.cardCounts,
    packetLayers: all('.fl-packets'),
    nodes: data.itemIds.map((_, i) => find(`#n-${i}`)),
    nodesById: indicesById(data.itemIds),
    cardEls: data.cardCounts.map((count, i) => Array.from({ length: count }, (_, k) => find(`#n-${i}-c${k}`))),
    groups: data.groupIds.map((_, j) => find(`#g-${j}`)),
    groupsById: indicesById(data.groupIds),
    edges: data.edgePanels.map((_, j) => ({ line: find(`#e-${j}`), label: find(`#l-${j}`) })),
    paths: data.edgePanels.map((_, j) => find(`#p-${j}`)),
    trackPaths: Array.from({ length: data.trackCount ?? 0 }, (_, k) => find(`#tp-${k}`)),
    values: data.values ?? [],
    valueEls: createValueEls(view, data),
    rowEls: createRowEls(view),
    parts: all('.fl-part'),
    sceneEls: all('[data-si]'),
    statusEls: all('.fl-status'),
    timingClips: all('.fl-timing-clip'),
    timingHeads: all('.fl-timing-head'),
    charts: createChartEls(view, data),
    packets: [],
    // 마지막으로 그린 박자와 요소별 값. 같은 값을 다시 쓰지 않으려고 둔다(그린 결과는 모습만으로 정해진다).
    painted: { key: '', si: undefined, cards: {}, chartFrames: {}, marks: new Set(), lights: {} },
    written: new WeakMap(),
    overlays: [],
  };
}

// 차트 카드마다 그려진 곳(같은 차트가 여러 판에 있으면 모두)의 계열(cs-번호) 요소, 행(cr-번호) 요소, 행 이름 요소. 요소는 그 차트의 data-chart 안에서만 찾아 다른 차트에 번지지 않는다.
function createChartEls(view, data) {
  return Object.fromEntries(
    Object.entries(data.chartMeta ?? {}).map(([cardId, meta]) => {
      const roots = [...view.querySelectorAll(`[data-chart="${CSS.escape(cardId)}"]`)];
      const within = (selector) => roots.flatMap((chart) => [...chart.querySelectorAll(selector)]);
      return [cardId, { series: meta.series.map((_, s) => within(`.cs-${s}`)), rows: meta.rowKeys.map((_, k) => within(`.cr-${k}`)) }];
    }),
  );
}

// 요소 el의 속성 name을 value로 쓴다. 지금 값과 같으면 쓰지 않는다.
function writeAttr(stage, el, name, value) {
  const seen = stage.written.get(el) ?? {};
  if (seen[name] === value) return;
  stage.written.set(el, { ...seen, [name]: value });
  el.setAttribute(name, value);
}

// 보였다 사라지는 변형(값 글자, 큐 찬 칸, 상태 알약, 카드 내용 층)을 켜거나 끈다. 불투명도 0인 요소는 접근성 트리에 남으므로 보임(visibility)도 같이 쓴다. 변형은 서로 들어 있지 않고 안쪽은 visibility를 정하지 않는다.
function showVariant(stage, el, isShown) {
  writeAttr(stage, el, 'opacity', isShown ? 1 : 0);
  writeAttr(stage, el, 'visibility', isShown ? 'visible' : 'hidden');
}

// 요소 el의 스타일 속성(사용자 정의 속성 포함) name을 value로 쓴다. 지금 값과 같으면 쓰지 않는다.
function writeStyle(stage, el, name, value) {
  const seen = stage.written.get(el) ?? {};
  const key = `style:${name}`;
  if (seen[key] === value) return;
  stage.written.set(el, { ...seen, [key]: value });
  el.style.setProperty(name, value);
}

// ---- 그리기 ----

/**
 * 모습(frame)을 그린다. 박자가 바뀌었을 때만 박자 전체 상태(상태 알약, 차트 계열, 점)를 새로 맞추고, 나머지는 프레임마다 모습의 값만 쓴다.
 * @param frame sampleScene이 돌려준 모습
 */
function paintFrame(stage, data, frame) {
  const seg = data.segs[frame.seg];
  const key = `${frame.seg}:${frame.phase}`;
  paintScene(stage, frame.si);
  if (stage.painted.key !== key) paintSegment(stage, seg, frame);
  stage.painted.key = key;
  paintCards(stage, frame.cards);
  paintHeld(stage, frame.held);
  paintEdges(stage, frame);
  paintValues(stage, frame);
  paintChartFrames(stage, data, frame.charts);
  paintPulses(stage, frame.pulses);
  paintTimings(stage, data, frame);
  stage.packets.forEach((packet) => packet.move(frame.elapsed));
  driveChartMotion(stage, frame);
}

// 순서 보기의 메시지, 메모, 구획, 활성 막대는 자기 장면(`data-si`)이 보일 때만 보인다. 장면이 바뀔 때 한 번 맞춘다. 장면에 들어서는 때와 다시 들어서는 때, 마지막 모습은 모두 같은 장면 번호의 요소만 보인다.
function paintScene(stage, si) {
  if (stage.painted.si === si) return;
  stage.painted.si = si;
  for (const el of stage.sceneEls) el.classList.toggle('fl-off', Number(el.dataset.si) !== si);
}

// 타이밍 보기의 드러냄 창과 재생 막대. 창 폭은 장면 처음부터 지금 시각까지의 비율이고(data-t0, data-t1은 그 장면 축의 시간표 시각), 마지막 모습은 다 드러나고 막대가 숨는다.
// 시각은 표본 추출기가 정한 박자와 박자 안 시각에서 읽기만 한다. 다른 장면의 창은 장면 표시(fl-off)가 숨긴다.
function paintTimings(stage, data, frame) {
  // 축은 장면의 표시 길이까지라 표시 시각(d)을 논리 시각으로 옮겨 읽는다. 장면의 처음 시각은 data-t0이다.
  const shown = frame.d * data.steps[frame.si].speed;
  const isFinal = frame.phase === 'final';
  const progress = (el) => (isFinal ? 1 : Math.min(1, Math.max(0, shown / Math.max(1, Number(el.dataset.t1) - Number(el.dataset.t0)))));
  for (const el of stage.timingClips) {
    if (Number(el.closest('[data-si]').dataset.si) !== frame.si) continue;
    const from = Number(el.dataset.from);
    writeAttr(stage, el, 'width', String(from + (Number(el.dataset.w) - from) * progress(el)));
  }
  for (const el of stage.timingHeads) {
    if (Number(el.closest('[data-si]').dataset.si) !== frame.si) continue;
    writeAttr(stage, el, 'visibility', isFinal ? 'hidden' : 'visible');
    writeAttr(stage, el, 'transform', `translate(${Number(el.dataset.w) * progress(el)} 0)`);
  }
}

// 박자 전체에서 변하지 않는 상태. 상태 알약, 차트 계열(보임과 자람), 점. 마지막 모습(phase가 final)이면 계열이 다 자란 채이고 점이 없다.
function paintSegment(stage, seg, frame) {
  stage.statusEls.forEach((el) => showVariant(stage, el, Boolean(seg.status?.includes(el.dataset.st))));
  drawChartState(stage, seg, frame.phase === 'play');
  stage.packets.forEach((packet) => packet.remove());
  stage.packets = frame.phase === 'play' ? seg.hops.map((hop) => createPacket(hop, stage)) : [];
  stage.painted.cards = {};
}

// 도형(논리 id)마다 보일 카드. 바뀐 도형만 다시 쓰고, 같은 도형이 여러 판에 있으면 모두 쓴다. 카드 층이 있는 판만 쓰고, 카드 층이 있는 판이 하나도 없으면(머리만 그리는 순서 보기뿐) 건너뛴다.
// 판 순서에 따라 첫 판이 카드 층이 없는 순서 보기일 수 있어 첫 번호만 보지 않는다.
function paintCards(stage, cards) {
  for (const [id, indices] of stage.nodesById) {
    if (!indices.some((i) => stage.cardCounts[i]) || stage.painted.cards[id] === `${cards[id]}`) continue;
    stage.painted.cards[id] = `${cards[id]}`;
    for (const i of indices) if (stage.cardCounts[i]) showCard(stage, i, cards[id]);
  }
}

function showCard(stage, i, shown) {
  stage.cardEls[i].forEach((layer, k) => showVariant(stage, layer, shown === k));
  stage.nodes[i].querySelector('.fl-card')?.classList.toggle('filled', shown !== undefined);
}

// 켜진 도형, 그룹(논리 id)과 시간 보기의 부분, 차트 밝히기를 모습의 값대로 맞춘다.
function paintHeld(stage, held) {
  const lit = new Set(held.lit);
  const parts = new Set(held.parts);
  for (const [id, indices] of stage.nodesById) for (const i of indices) stage.nodes[i].classList.toggle('on', lit.has(id));
  for (const [id, indices] of stage.groupsById) for (const j of indices) stage.groups[j].classList.toggle('on', lit.has(id));
  stage.parts.forEach((part) => part.classList.toggle('on', parts.has(part.dataset.part)));
  paintLights(stage, held.lights);
}

// 밝힌 행이 있는 차트는 나머지 행을 흐린다. 밝힌 행이 없으면 흐리지 않는다. 차트마다 따로다.
function paintLights(stage, lights) {
  for (const [cardId, els] of Object.entries(stage.charts)) {
    const lit = lights[cardId] ?? [];
    const key = lit.join('\u0001');
    if (stage.painted.lights[cardId] === key) continue;
    stage.painted.lights[cardId] = key;
    stage.chartMeta[cardId].rowKeys.forEach((name, k) => els.rows[k].forEach((el) => el.classList.toggle('dim', lit.length > 0 && !lit.includes(name))));
  }
}

/**
 * 선과 고정 알약. 선은 점이 하나 이상 올라 있는 동안 is-current이고, 선과 알약은 켜 둔 선(held)이거나 알약 색이 남아 있는 동안 on이다.
 * 알약은 늘 그대로 보인다(글자와 중립 알약 바탕을 투명하게 하지 않는다). 점이 올라 있다가 비면 알약의 활성 색(--pill-tint, 1에서 0)만 줄어들어 중립으로 돌아온다.
 * 조용한 선(quiet)의 보임은 켜 둔 선이거나 알약 색이 남은 동안 `on`이 정한다. 켜 둔 선은 점이 지나간 뒤에도 남을 수 있지만 알약의 활성 색을 붙들지 않는다.
 */
function paintEdges(stage, frame) {
  const held = new Set(frame.held.edges);
  stage.edges.forEach(({ line, label }, j) => {
    if (!line) return;
    const tint = frame.edges[j]?.pill ?? 0;
    line.classList.toggle('is-current', Boolean(frame.edges[j]?.active));
    for (const el of [line, label]) el?.classList.toggle('on', held.has(j) || tint > 0);
    // 알약 색은 라벨 묶음과 선 묶음(관계 끝 글 `edgelabel`이 안에 있다)이 같은 세기를 읽는다.
    for (const el of [line, label]) if (el) writeStyle(stage, el, '--pill-tint', String(tint));
  });
}

// ---- 차트 계열 ----

// 차트마다 따로: 드러낸 계열을 보이고, 이 박자에 드러내는 계열은 자라는 움직임을 다시 건다(mayGrow가 거짓이면 걸지 않고 다 자란 채 둔다). 시간표에 이 차트의 상태가 없으면 모든 계열이 보인다.
function drawChartState(stage, seg, mayGrow) {
  for (const [cardId, els] of Object.entries(stage.charts)) {
    const state = seg.charts[cardId];
    const names = stage.chartMeta[cardId].series;
    els.series.forEach((list, s) => {
      const isGrowing = mayGrow && state?.growing.includes(names[s]);
      for (const el of list) {
        el.classList.toggle('hidden', state !== undefined && !state.series.includes(names[s]));
        el.classList.remove('play');
        if (isGrowing) {
          el.getBoundingClientRect();
          el.classList.add('play');
        }
      }
    });
  }
}

// 차트 움직임(막대, 선, 값 글자, 점의 CSS 애니메이션)을 박자 안 논리 시각에 둔다. 브라우저 시계를 따로 따르지 않게 늘 멈춰 두고 currentTime을 모습의 시각으로 쓴다.
// 마지막 모습은 끝까지 감는다. 시간이 거꾸로 가거나 건너뛰어도 같은 결과다.
function driveChartMotion(stage, frame) {
  for (const animation of stage.view.getAnimations({ subtree: true })) {
    if (!animation.animationName?.startsWith('chart-')) continue;
    animation.pause();
    if (frame.phase === 'final') animation.finish();
    else animation.currentTime = frame.elapsed;
  }
}

// ---- 점과 글 상자 ----

// 점과 글 상자. 글 상자 줄과 자리는 시간표가 움직이는 SVG와 같게 정해 넘긴다. move(elapsed)는 박자 안 시각에서 점의 자리와 보임만 정한다.
// 점은 그 선이 있는 판의 점 층에 놓는다. 선 번호와 흐름 길 번호가 판을 가로질러 하나뿐이어서 판은 data.edgePanels, data.trackPanels가 알려 준다.
function createPacket(hop, stage) {
  const { metrics } = stage;
  const isTrack = hop.track !== undefined;
  const path = isTrack ? stage.trackPaths[hop.track] : stage.paths[hop.edge];
  const layer = stage.packetLayers[isTrack ? stage.trackPanels[hop.track] : stage.edgePanels[hop.edge]];
  if (hop.tone !== undefined && !metrics.tones?.[hop.tone]) throw new Error(`이동의 색 이름이 정본이 아니다: ${JSON.stringify(hop.tone)}(가능: ${Object.keys(metrics.tones ?? {}).join(', ')})`);
  const color = hop.tone ? metrics.tones[hop.tone] : metrics.active;
  const outline = metrics.toneOutlines?.[hop.tone];
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'fl-packet');
  g.style.opacity = 0;
  g.setAttribute('fill', metrics.toneInks?.[hop.tone] ?? metrics.chipInk);
  g.innerHTML = `<circle r="${metrics.halo}" fill="${color}" opacity="${metrics.haloOpacity}"/><circle r="${metrics.packet}" fill="${color}"${outline ? ` stroke="${outline}" stroke-width="${metrics.chipStroke}"` : ''}/>`;
  layer.appendChild(g);
  const chip = hop.data ? createChip(hop.data, { size: hop.chipSize, metrics, color: hop.tone ? color : undefined, outline }) : undefined;
  if (chip) g.appendChild(chip.g);
  const length = path.getTotalLength();
  const slide = chipSlide(hop, metrics);
  const end = hop.cut ?? hop.ms;
  let isDrawn = false;
  return {
    remove: () => g.remove(),
    move(elapsed) {
      const t = elapsed - (hop.at ?? 0);
      const isLive = t >= 0 && t < end;
      if (!isLive && !isDrawn) return;
      isDrawn = isLive;
      const p = Math.min(1, Math.max(0, t / hop.ms));
      const eased = progressAt(metrics.move, p, hop.pace);
      const point = path.getPointAtLength(length * (hop.isBack ? 1 - eased : eased));
      g.setAttribute('transform', `translate(${point.x} ${point.y})`);
      if (chip) {
        const [dx, dy, opacity] = slide(p);
        chip.g.setAttribute('transform', `translate(${dx} ${dy})`);
        chip.g.style.opacity = opacity * chipFadeAt(hop.chipFade, t);
      }
      const isInside = (hop.gaps ?? []).some(([from, to]) => eased > from && eased < to);
      g.style.opacity = isLive && !isInside ? cutFade(hop, t, metrics) : 0;
    },
  };
}

// 단계 끝에서 잘리는 점(hop.cut)이 끝 앞 cutFadeMs 동안 서서히 사라지는 불투명도. 그 밖의 점은 1이다.
function cutFade(hop, t, metrics) {
  return hop.cut === undefined ? 1 : Math.min(1, (hop.cut - t) / metrics.cutFadeMs);
}

function createChip(lines, { size, metrics, color, outline }) {
  const chip = document.createElementNS(SVG_NS, 'g');
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('rx', metrics.chipRadius);
  rect.setAttribute('fill', color ?? metrics.chipFill);
  if (color) {
    rect.setAttribute('stroke', outline ?? color);
    rect.setAttribute('stroke-width', metrics.chipStroke);
  }
  chip.appendChild(rect);
  const texts = lines.map((line) => createChipLine(line, chip));
  const { w, h } = size;
  const top = -h - metrics.chipGap;
  rect.setAttribute('x', -w / 2);
  rect.setAttribute('y', top);
  rect.setAttribute('width', w);
  rect.setAttribute('height', h);
  texts.forEach((t, li) => t.setAttribute('y', top + metrics.chipLine * (li + 1)));
  return { g: chip, w, h };
}

function createChipLine(line, chip) {
  const text = document.createElementNS(SVG_NS, 'text');
  text.setAttribute('class', 'chip');
  text.append(
    ...richNodes(line, () => {
      const code = document.createElementNS(SVG_NS, 'tspan');
      code.setAttribute('class', 'code');
      return code;
    }),
  );
  chip.appendChild(text);
  return text;
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 후광(도착, 차트 표)과 차트 틀 바꾸기를 그린다.
// 모습(frame.pulses, frame.charts)이 가리키는 값을 그대로 쓰고, 지난 프레임의 후광이 남았는지는 마지막으로 그린 키 집합으로만 본다.

// 도형 윤곽 후광을 겹칠 윤곽 요소를 찾는 선택자. 모든 도형 종류의 바깥 윤곽은 도형 묶음 바로 아래의 .fl-stroke 요소이고, 종류에 따라 하나(상자, 표, 차트 카드 등)이거나 여럿(저장소: 몸통과 뚜껑)이다.
// 윤곽 요소가 없는 도형은 후광이 없다.
const OUTLINE_SELECTOR = ':scope > .fl-stroke';

/**
 * 후광을 그린다. 도착 후광은 도형 윤곽과 같은 모양의 겹침 선 하나의 불투명도이고(면이나 선 굵기를 키우지 않는다),
 * 차트 표식 후광은 문서에 미리 들어 있는 표식 겹침(chart/pulse-overlay.js)의 불투명도다. 겹침의 색은 표식이 싣고 온 계열 칠이라 표식 자신의 칠과 테두리는 그대로다.
 * 같은 도형과 같은 차트가 여러 곳에 그려져도 후광은 논리 사건 하나이고, 있는 곳마다 같은 값을 쓴다.
 */
function paintPulses(stage, pulses) {
  for (const [id, indices] of stage.nodesById) {
    const level = pulses[`node:${id}`] ?? 0;
    for (const i of indices) for (const overlay of level > 0 ? overlayOf(stage, i) : (stage.overlays[i] ?? [])) writeAttr(stage, overlay, 'opacity', level);
  }
  const live = new Set(Object.keys(pulses).filter((key) => key.startsWith('chart:')));
  for (const key of new Set([...stage.painted.marks, ...live])) {
    const level = live.has(key) ? pulses[key] : 0;
    for (const overlay of markOverlays(stage, key)) writeAttr(stage, overlay, 'opacity', level);
  }
  stage.painted.marks = live;
}

// 도형 i의 도착 후광 겹침 선 목록. 도형 윤곽(.fl-stroke)마다 복제해 면을 없애고 그 바로 위에 겹친다. 처음 필요할 때 한 번 만든다.
// 윤곽 요소가 없는 도형은 후광이 없어 빈 목록이다(OUTLINE_SELECTOR).
function overlayOf(stage, i) {
  if (stage.overlays[i] !== undefined) return stage.overlays[i];
  stage.overlays[i] = [...stage.nodes[i].querySelectorAll(OUTLINE_SELECTOR)].map((outline) => {
    const overlay = outline.cloneNode(false);
    overlay.removeAttribute('id');
    // 도착 후광은 도형이 고른 색과 상관없이 공통 UI 강조 색이다(figure.css .fl-pulse).
    overlay.setAttribute('class', 'fl-pulse');
    overlay.setAttribute('opacity', 0);
    overlay.setAttribute('aria-hidden', 'true');
    outline.after(overlay);
    return overlay;
  });
  return stage.overlays[i];
}

// 후광 키 `chart:차트 id:표식 id`의 표식 겹침들. 같은 차트가 여러 판에 그려지면 모두 돌려준다.
function markOverlays(stage, key) {
  const rest = key.slice('chart:'.length);
  const split = rest.indexOf(':');
  const [chart, mark] = [CSS.escape(rest.slice(0, split)), CSS.escape(rest.slice(split + 1))];
  return stage.view.querySelectorAll(`[data-chart="${chart}"] [data-pulse-of="${mark}"]`);
}

// 표식을 바꿀 때 그 표식의 겹침도 표식의 지금 모양에 맞춘다(보이지 않을 때도 같아서 겹침의 모양은 지나온 시각에 기대지 않는다).
// 글 표식의 겹침은 표식 바로 앞에, 모양 표식의 겹침은 바로 뒤에 있다(나타나는 표식은 `.fl-mark-pulse-wrap` 묶음 하나가 사이에 든다). 따라갈 속성은 문서를 만들 때 정한 목록(metrics.markGeometry)이고 칠은 따라가지 않는다.
function followMark(stage, base) {
  const isText = base.localName === 'text';
  const next = isText ? base.previousElementSibling : base.nextElementSibling;
  // 나타나는 표식(점, 값 글자)의 겹침은 표식과 같은 나타남을 받는 묶음 안에 있다.
  const overlay = next?.classList.contains('fl-mark-pulse-wrap') ? next.firstElementChild : next;
  if (!overlay?.hasAttribute('data-pulse-of')) return;
  for (const name of stage.metrics.markGeometry) {
    const value = base.getAttribute(name);
    if (value === null) overlay.removeAttribute(name);
    else if (overlay.getAttribute(name) !== value) overlay.setAttribute(name, value);
  }
  if (isText && overlay.innerHTML !== base.innerHTML) overlay.innerHTML = base.innerHTML;
}

/**
 * 차트 틀 바꾸기. 보일 틀(frames[i])의 표 가운데 지금 그려진 틀과 속성이나 글이 다른 표만 쓴다. 처음 그리거나 틀을 건너뛰어도 같은 결과다.
 * @param shown { 차트 id: 틀 번호 }
 */
function paintChartFrames(stage, data, shown) {
  for (const [cardId, index] of Object.entries(shown)) {
    const frames = data.chartFrames?.[cardId]?.frames;
    const was = stage.painted.chartFrames[cardId];
    if (!frames || was === index) continue;
    const names = attrNamesOf(data.chartFrames[cardId]);
    for (const [mark, next] of Object.entries(frames[index])) if (was === undefined || JSON.stringify(frames[was][mark]) !== JSON.stringify(next)) setMark(stage, cardId, mark, next, names[mark]);
    stage.painted.chartFrames[cardId] = index;
  }
}

// 표마다 어느 틀에서든 쓰인 속성 이름. 틀에 없는 속성은 지워야 이전 틀에만 있던 속성이 남지 않는다. 데이터마다 한 번 구해 둔다.
const attrNameCache = new WeakMap();
function attrNamesOf(chartFrames) {
  if (!attrNameCache.has(chartFrames)) {
    const names = {};
    for (const frame of chartFrames.frames) for (const [mark, { attrs }] of Object.entries(frame)) names[mark] = [...new Set([...(names[mark] ?? []), ...Object.keys(attrs)])];
    attrNameCache.set(chartFrames, names);
  }
  return attrNameCache.get(chartFrames);
}

// 재생기가 요소에 직접 달고 떼는 class. 표의 class 속성을 바꿀 때 이 class는 그대로 둔다.
const PLAYER_CLASSES = ['hidden', 'play', 'dim'];

// 표 하나를 틀의 속성과 글로 만든다. names에 있고 틀에 없는 속성은 지워 어떤 틀에서 왔든 같은 결과가 된다. 글은 차트 그리기가 이스케이프한 글이라 markup으로 쓴다.
// 글 요소(data-mark-text)도 자리 속성(x, y)이 틀마다 다르므로 속성을 쓴다.
function setMark(stage, cardId, mark, { attrs, text }, names) {
  const scope = `[data-chart="${CSS.escape(cardId)}"]`;
  const id = CSS.escape(mark);
  for (const el of stage.view.querySelectorAll(`${scope} [data-mark="${id}"], ${scope} [data-mark-text="${id}"]`)) {
    for (const name of names) {
      if (name === 'class') el.setAttribute('class', [...(attrs.class ?? '').split(/\s+/).filter(Boolean), ...PLAYER_CLASSES.filter((c) => el.classList.contains(c))].join(' '));
      else if (name in attrs) el.setAttribute(name, attrs[name]);
      else el.removeAttribute(name);
    }
    if (text !== undefined && el.hasAttribute('data-mark-text')) el.innerHTML = text;
    followMark(stage, el);
  }
}

// 브라우저에서는 이미 검사한 두 배치의 판 묶음만 교체한다. 시계, 선택 단계, 탭은 같은 객체를 유지하고, 교체한 그림은 지금 시계의 모습(마지막 모습 포함)으로 다시 그린다.
// 두 배치의 시각은 같다(reflow-timeline.js). 장면 모델은 점이 지나는 선 구간이 배치마다 달라서 새 데이터로 다시 만든다.
// 좁은 배치는 그래프·차트·시간 보기가 있는 그림에 들어갈 수 있다(html/responsive.js). 그림은 틀 폭에 맞춰 줄어 보이고 가로로 스크롤하지 않는다.

/**
 * 좁은 배치가 있으면 배치를 고르는 함수 (isNarrow) → 그 배치의 재생 데이터를 돌려준다. 좁은 배치가 없으면 undefined다.
 * 같은 배치를 다시 고르면 아무것도 바꾸지 않는다.
 */
function bindResponsiveScene(root, player) {
  const template = root.querySelector('template.fl-narrow');
  if (!template) return;
  const panels = root.querySelector('.dp-panels');
  const layoutOf = (container, data) => ({ data, nodes: [...container.childNodes], style: container.getAttribute('style') });
  const wide = layoutOf(panels.cloneNode(true), player.data);
  const narrow = layoutOf(template.content.querySelector('.dp-panels'), player.data.responsive.data);
  let current = wide;
  return (isNarrow) => {
    const next = isNarrow ? narrow : wide;
    if (next === current) return next.data;
    const focused = panels.contains(document.activeElement) ? document.activeElement.id : undefined;
    for (const animation of panels.getAnimations({ subtree: true })) animation.cancel();
    panels.replaceChildren(...next.nodes.map((node) => node.cloneNode(true)));
    panels.setAttribute('style', next.style);
    panels.dataset.layout = isNarrow ? 'narrow' : 'wide';
    player.data = next.data;
    player.scenes = player.data.segs.length ? buildScenes(player.data) : [];
    player.stage = createStage(root, next.data);
    if (document.documentElement.classList.contains('embedded')) fitEmbedded(root, next.data);
    // 시계는 그대로이고 새 그림에 지금 시각의 모습을 그린다. 절대 시각과 마지막 모습 여부가 보존된다.
    if (player.scene >= 0) renderScene(player);
    if (focused) panels.querySelector(`#${CSS.escape(focused)}`)?.focus({ preventScroll: true });
    current = next;
    return next.data;
  };
}

// 브라우저 글 상자 보간. 이동 수학은 player-script.js가 motion-math.js의 함수 원문으로 넣는다.

// cost: time O(STEPS·k), 프레임마다 O(k), heap O(k), stack O(1)
// vars: STEPS = 공통 이동 수학의 이분 탐색 횟수, k = 경로 지점 수
// basis: estimate
// 글 상자 옮김과 불투명도. 빌드 때 시간표에 담은 경로 지점별 [진행 비율, dx, dy, opacity]를 움직이는 SVG의 SMIL(지점이 점에 닿는 시각 사이를 선형)과 같게 시간 비율 p에서 보간한다. [dx, dy, opacity]를 돌려준다.
function chipSlide(hop, metrics) {
  const path = hop.chipPath ?? [];
  const times = path.map(([at]) => timeAtProgress(metrics.move, at, hop.pace));
  return (p) => {
    if (!path.length) return [0, 0, 1];
    const k = times.findLastIndex((time) => time <= p);
    if (k < 0) return path[0].slice(1);
    if (k === path.length - 1) return path[k].slice(1);
    const ratio = times[k + 1] > times[k] ? (p - times[k]) / (times[k + 1] - times[k]) : 1;
    return [1, 2, 3].map((i) => path[k][i] + (path[k + 1][i] - path[k][i]) * ratio);
  };
}

// cost: time O(k), heap O(1), stack O(1)
// vars: k = 키 수
// basis: estimate
// 이동 시작 뒤 t(ms)의 글 상자 숨김 불투명도. 시간표가 한 번 계산한 키 [시각, 값]을 시간에 선형으로 읽기만 한다(src/chip-clash.js의 fadeAt과 같은 값이다). 키가 없으면 1이다.
function chipFadeAt(keys, t) {
  if (!keys?.length) return 1;
  const k = keys.findLastIndex(([at]) => at <= t);
  if (k < 0) return keys[0][1];
  if (k === keys.length - 1) return keys[k][1];
  const [[a, va], [b, vb]] = [keys[k], keys[k + 1]];
  return va + ((vb - va) * (t - a)) / (b - a);
}

// 브라우저와 Node 시험이 같은 글을 쓴다(play.js와 한 스크립트로 이어 붙고, 시험도 HTML에 넣는 같은 스크립트를 불러 쓴다). DOM, 시계, 난수를 쓰지 않는다.
// 시간표(data)에서 장면마다 사건 모델을 한 번 만들고, 장면에 들어선 뒤 흐른 표시 시각을 주면 그 순간의 모습을 돌려주는 순수 함수다.
// 같은 (모델, 시각)은 앞서 어떤 시각을 샘플했든 같은 모습이다. 이전 프레임, 웹 애니메이션 끝 알림, 요소 충돌에서 사건을 읽지 않는다.
// 시각은 두 가지다. 논리 시각은 시간표의 ms이고 speed가 이동 시간만 배로 바꾼다(표시 시각 d의 논리 시각 = 장면 시작 + d·speed).
// 후광, 알약 줄어듦, 반복 꼬리는 사람이 보는 표시 시각으로 재서 speed와 상관없다.
// 켜진 선, 도형, 부분, 차트 밝히기, 값과 차트 틀이 바뀌는 시각의 후광은 시간표가 정한 값(marks, pulses, values, charts)을 읽기만 한다. 같은 논리 사건은 판이 여럿이어도 하나다.

const SCENE_MODES = ['static', 'once', 'loop'];
const STEP_KEYS = ['label', 'mode', 'speed'];
const TIMING_KEYS = ['riseMs', 'holdMs', 'decayMs', 'fadeMs'];
// 곡선 역산(이분 탐색)의 부동소수 오차보다 크고 사건 간격보다 훨씬 작다. 같은 선에서 나가고 들어서는 두 점이 이어 붙는지 볼 때만 쓴다.
const RUN_JOIN_EPSILON_MS = 1e-5;

/**
 * 장면마다 사건 모델을 만든다. 단계 값이 { label, mode, speed } 정본이 아니면 오류다(글이나 빠진 값을 기본값으로 받지 않는다).
 * @param data { steps, segs, marks?, pulses?, values?, charts?, chartFrames?, metrics: { move, pulse: { riseMs, holdMs, decayMs, fadeMs } } }
 */
function buildScenes(data) {
  const timing = checkTiming(data.metrics.pulse);
  return data.steps.map((step, si) => buildScene(data, si, checkStep(step, si), timing));
}

// 단계 값이 정확히 { label: 글, mode: static|once|loop, speed: 양의 유한수 }인지 본다. 아니면 어느 단계의 무엇이 틀렸는지 알리는 오류다.
function checkStep(step, si) {
  const fail = (why) => {
    throw new Error(`steps[${si}]: ${why}`);
  };
  if (step === null || typeof step !== 'object' || Array.isArray(step)) fail(`{ label, mode, speed } 객체여야 한다(받은 값: ${JSON.stringify(step)})`);
  const extra = Object.keys(step).filter((key) => !STEP_KEYS.includes(key));
  if (extra.length || STEP_KEYS.some((key) => !(key in step))) fail(`키는 정확히 ${STEP_KEYS.join(', ')}여야 한다(받은 키: ${Object.keys(step).join(', ')})`);
  if (typeof step.label !== 'string') fail('label은 글이어야 한다');
  if (!SCENE_MODES.includes(step.mode)) fail(`mode는 ${SCENE_MODES.join(', ')} 중 하나여야 한다(받은 값: ${JSON.stringify(step.mode)})`);
  if (typeof step.speed !== 'number' || !Number.isFinite(step.speed) || !(step.speed > 0)) fail(`speed는 양의 유한수여야 한다(받은 값: ${JSON.stringify(step.speed)})`);
  return step;
}

function checkTiming(timing) {
  if (!timing || TIMING_KEYS.some((key) => !(timing[key] >= 0 && Number.isFinite(timing[key])))) throw new Error(`metrics.pulse는 ${TIMING_KEYS.join(', ')}(0 이상의 유한수)를 가져야 한다`);
  return { ...timing, tailMs: Math.max(timing.riseMs + timing.holdMs + timing.decayMs, timing.fadeMs) };
}

// 장면 si의 사건 모델. 선이 점으로 차 있는 구간, 켜진 구간, 후광이 시작하는 시각을 정하고, 표시 길이(마지막 사건의 효과가 끝날 때까지)는 시간표가 정한 값(data.presentation)을 읽는다.
function buildScene(data, si, step, timing) {
  const first = data.segs.findIndex((seg) => seg.si === si);
  if (first < 0) throw new Error(`steps[${si}]: 이 장면에 속한 박자가 없다`);
  const last = data.segs.findLastIndex((seg) => seg.si === si);
  const segs = data.segs.slice(first, last + 1);
  const presentationMs = data.presentation?.[si];
  if (!(presentationMs >= 0 && Number.isFinite(presentationMs))) throw new Error(`steps[${si}]: presentation(표시 길이)이 0 이상의 유한수여야 한다(받은 값: ${JSON.stringify(presentationMs)})`);
  const scene = { si, label: step.label, mode: step.mode, speed: step.speed, first, last, segs, t0: segs[0].t0, t1: segs.at(-1).t1, timing, presentationMs };
  scene.edgeRuns = edgeRunsOf(segs, data.metrics.move);
  scene.held = heldRangesOf(data, scene);
  scene.pulses = pulseOnsetsOf(data, scene);
  return scene;
}

// ---- 선 사용 구간 ----

// 선마다 점이 한 개 이상 올라 있는 논리 시각 구간(전체 시간표 ms, [from, to))의 목록. 닿거나 겹치는 구간은 합쳐서, 한 점이 나가는 시각에 다른 점이 들어서도 선이 꺼지는 프레임이 없다.
// 선 번호는 판을 합친 장면의 선 번호라 같은 이동을 보이는 여러 판의 선이 각각 자기 구간을 갖는다.
function edgeRunsOf(segs, move) {
  const spans = new Map();
  for (const seg of segs) for (const hop of seg.hops) for (const leg of hopLegs(hop, move)) spans.set(leg.edge, [...(spans.get(leg.edge) ?? []), [seg.t0 + (hop.at ?? 0) + leg.from, seg.t0 + (hop.at ?? 0) + leg.to]]);
  return new Map([...spans].map(([edge, list]) => [edge, mergeRuns(list)]));
}

function mergeRuns(list) {
  const merged = [];
  for (const [from, to] of [...list].sort((a, b) => a[0] - b[0] || a[1] - b[1])) {
    const tail = merged.at(-1);
    if (tail && from <= tail[1] + RUN_JOIN_EPSILON_MS) tail[1] = Math.max(tail[1], to);
    else merged.push([from, to]);
  }
  return merged;
}

/**
 * 점 하나가 각 선에 올라 있는 박자 안 구간 { edge, from, to }(ms). 도형 안을 지나는 구간(gaps)은 어느 선에도 속하지 않는다.
 * 박자의 이동(hop.edge)은 선 하나에 이동 내내 있고, 흐름의 점(hop.track)은 시간표의 길 계획(hop.legEdges, 구간마다 선 번호)대로 구간마다 그 선에 있다.
 * 잘리는 점(hop.cut)은 거기까지만 선에 있다. 정본이 아닌 이동은 근사로 받지 않고 오류다.
 */
function hopLegs(hop, move) {
  const end = hop.cut ?? hop.ms;
  const isTrack = hop.track !== undefined;
  const edges = isTrack ? hop.legEdges : [hop.edge];
  const gaps = hop.gaps ?? [];
  const isGap = (gap) => Array.isArray(gap) && gap.length === 2 && gap.every(Number.isFinite);
  if (!(hop.ms > 0 && Number.isFinite(hop.ms)) || !Array.isArray(edges) || !edges.length || !edges.every(Number.isInteger) || (isTrack && (gaps.length !== edges.length - 1 || !gaps.every(isGap)))) {
    throw new Error(`이동이 정본이 아니다: ${isTrack ? `track ${hop.track}` : `edge ${hop.edge}`}, ms ${hop.ms}, legEdges ${JSON.stringify(hop.legEdges)}, gaps ${JSON.stringify(hop.gaps)}`);
  }
  const spanOf = (k) => (isTrack ? [k === 0 ? 0 : gaps[k - 1][1], k === edges.length - 1 ? 1 : gaps[k][0]] : [0, 1]);
  const timeOf = (f) => (f <= 0 ? 0 : f >= 1 ? hop.ms : hop.ms * timeAtProgress(move, f, hop.pace));
  return edges.flatMap((edge, k) => {
    const [from, to] = spanOf(k).map(timeOf);
    return from < end && from < to ? [{ edge, from, to: Math.min(to, end) }] : [];
  });
}

// ---- 켜진 구간 ----

/**
 * 장면과 겹치는 조용한 선의 보이는 구간 목록 { kind: 'edge', key, ranges }(`quiet:번호`, data.marks). 알 수 없는 키는 오류다.
 * 켜 둔 도형, 부분, 차트 행(`light`)은 구간이 그 장면에서 지금까지 켠 목록(nodesOn, partsOn, charts[id].lights)으로 갖는다(heldAt). 길이 0인 구간도 같은 규칙으로 읽힌다.
 * 점이 지나간 선은 켜 두지 않는다: 옛 `edge:` 키는 더 이상 없고 오류다. 점이 지나는 동안의 선은 이동 목록에서 따로 구한 선 사용 구간(edgeRuns)이 맡는다.
 */
function heldRangesOf(data, scene) {
  const held = [];
  for (const [key, ranges] of Object.entries(data.marks ?? {})) {
    const [kind, rest] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    if (kind !== 'quiet') throw new Error(`marks의 키가 정본이 아니다: ${key}${kind === 'edge' ? '(지나간 선은 켜 두지 않는다)' : ''}`);
    // 구간은 [시작, 끝, 출처 장면]이다. 이 장면 것만 읽는다: 다른 장면에서 지나간 조용한 선은 이 장면에서 보이지 않는다.
    if (!ranges.every((range) => Array.isArray(range) && range.length === 3 && Number.isFinite(range[0]) && Number.isFinite(range[1]) && range[0] <= range[1] && Number.isInteger(range[2]))) throw new Error(`marks의 구간이 정본이 아니다: ${key} ${JSON.stringify(ranges)}([시작, 끝, 장면 번호]여야 한다)`);
    const own = ranges.filter(([, , si]) => si === scene.si);
    if (own.length) held.push({ kind: 'edge', key: Number(rest), ranges: own });
  }
  return held;
}

// 논리 시각 x가 장면 소유 구간 목록에 들어 있는지. 장면 끝 시각(x가 end 이상)은 장면의 마지막 순간이라 끝까지 이어진 구간을 읽는다. 길이 0인 구간은 그 시각에서만 든다.
function isCovered(ranges, x, end) {
  return ranges.some(([from, to]) => (x >= end ? to >= end : from <= x && (x < to || (from === to && x === from))));
}

// ---- 후광 시작 시각 ----

/**
 * 후광 키마다 시작하는 논리 시각 오름차순 목록. 키는 `node:도형 논리 id`, `value:값 줄 번호`, `chart:차트 id:표 id`다.
 * 점이 도착한 도형(통과하지 못하고 사라진 점은 시간표가 넣지 않는다)은 구간의 pulses이고, 값이 실제로 바뀐 시각과 차트 표가 실제로 달라진 시각은 시간표의 pulses(같은 틱 안에서 제자리로 돌아온 변화는 시간표가 이미 뺐다)다.
 * 후광은 시각이 아니라 출처 장면에 속한다(`si`). 그래서 장면 끝 시각에 닿은 점의 후광도 그 장면의 꼬리까지 보인다.
 */
function pulseOnsetsOf(data, scene) {
  const onsets = new Map();
  const add = (key, at) => onsets.set(key, [...(onsets.get(key) ?? []), at]);
  for (const seg of scene.segs) for (const { id, at } of seg.pulses ?? []) add(`node:${id}`, seg.t0 + at);
  for (const { key, at, si } of data.pulses ?? []) if (si === scene.si) add(key, at);
  for (const list of onsets.values()) list.sort((a, b) => a - b);
  return onsets;
}

// ---- 샘플 ----

/**
 * 장면에 들어선 뒤 흐른 표시 시각 elapsed(ms)가 가리키는 때. 정지는 늘 마지막 모습, 한 번은 표시 길이가 지나면 마지막 모습을 유지하고, 반복은 표시 길이마다 처음으로 돌아간다.
 * isSettled(움직임 줄이기, 한 번 장면이 끝나 멈춤)이면 방식과 상관없이 마지막 모습이다.
 * @returns { phase: 'play' | 'final', d } d는 장면 안 표시 시각이다. 마지막 모습은 d가 표시 길이라 후광과 점이 모두 끝나 있다.
 */
function clockOf(scene, elapsed, isSettled) {
  const total = scene.presentationMs;
  if (isSettled || scene.mode === 'static' || !(total > 0)) return { phase: 'final', d: total };
  const now = Math.max(0, elapsed);
  if (scene.mode === 'once') return now >= total ? { phase: 'final', d: total } : { phase: 'play', d: now };
  return { phase: 'play', d: now % total };
}

/**
 * 시각 elapsed에서 장면의 모습. 앞서 어떤 시각을 샘플했는지에 기대지 않는다. isSettled가 참이면 방식과 시각에 상관없이 마지막 모습이다(clockOf).
 * @returns { phase, d, seg, elapsed, cards, edges, held, pulses, values, charts }
 * seg는 전체 박자 번호, elapsed는 그 박자 안 논리 ms, cards는 도형 논리 id별 보일 카드 번호, edges는 { 선 번호: { active, pill } }(pill은 0~1),
 * held는 { edges, lit, parts, lights }(켜진 선 번호, 켜진 도형·그룹 논리 id, 켜진 부분, { 차트 id: 밝힌 행 이름[] }),
 * pulses는 { 키: 0~1 }(0보다 큰 것만), values는 값 줄별 보일 글(이 장면 줄이 아니면 없다), charts는 { 차트 id: 보일 틀 번호 }다.
 */
function sampleScene(scene, data, elapsed, isSettled = false) {
  const { phase, d } = clockOf(scene, elapsed, isSettled);
  // 표시 길이는 반올림되어 있어 d·speed가 장면 끝보다 조금 모자랄 수 있다. 마지막 모습은 늘 장면 끝 시각을 읽는다(끝 시각의 길이 0 박자를 잃지 않는다).
  const isFinal = phase === 'final';
  const logical = isFinal ? Math.max(scene.t0 + d * scene.speed, scene.t1) : scene.t0 + d * scene.speed;
  const held = Math.min(logical, scene.t1);
  const seg = scene.segs.findLast((s) => s.t0 <= held);
  const local = Math.min(held - seg.t0, seg.t1 - seg.t0);
  return {
    phase,
    d,
    si: scene.si,
    seg: scene.first + scene.segs.indexOf(seg),
    elapsed: local,
    cards: cardsAt(seg, local),
    // 마지막 모습은 정의상 쉼이다. 표시 길이는 마지막 효과가 끝나는 시각이라 알약과 후광은 남지 않으며, 표시 길이를 반올림한 끝자리의 양수 찌꺼기를 항목으로 내지 않는다.
    edges: isFinal ? {} : edgeStatesAt(scene, logical),
    held: heldAt(scene, held, seg),
    pulses: isFinal ? {} : pulsesAt(scene, d),
    values: valuesAt(data, scene.si, held),
    charts: chartsAt(data, scene.si, held),
  };
}

// 박자 안 시각 elapsed에 도형(논리 id)마다 보일 카드 번호. 점이 닿는 시각(cardsAt) 전에는 박자 처음 카드, 그 시각부터는 박자 끝 카드다.
function cardsAt(seg, elapsed) {
  const cards = { ...seg.cardsBefore };
  for (const [id, at] of Object.entries(seg.cardsAt)) if (elapsed >= at) cards[id] = seg.cards[id];
  return cards;
}

// 논리 시각 at(구간 seg 안)에 보이는 조용한 선과 켜진 도형·그룹, 부분, 차트 밝히기. 켜 둔 것은 구간이 그 장면에서 지금까지 `light`로 켠 대상이다.
function heldAt(scene, at, seg) {
  const out = { edges: [], lit: [...seg.nodesOn], parts: [...seg.partsOn], lights: {} };
  for (const [id, chart] of Object.entries(seg.charts ?? {})) if (chart.lights.length) out.lights[id] = [...chart.lights];
  for (const entry of scene.held) if (isCovered(entry.ranges, at, scene.t1)) out.edges.push(entry.key);
  return out;
}

// 선이 지금 점으로 차 있는지(active)와 고정 알약 세기(pill, 0~1). 알약은 선이 차 있는 동안 1이고, 비면 fadeMs(표시 시각) 동안 1에서 0으로 줄어든다. 켜 둔 선(held)과는 따로다.
// 선마다 구간 목록을 훑는다. 구간은 선을 지나간 점의 수만큼이다.
function edgeStatesAt(scene, logical) {
  const edges = {};
  for (const [edge, runs] of scene.edgeRuns) {
    const active = runs.some(([from, to]) => from <= logical && logical < to);
    const ended = runs.findLast(([, to]) => to <= logical);
    const pill = active ? 1 : ended ? Math.max(0, 1 - (logical - ended[1]) / scene.speed / scene.timing.fadeMs) : 0;
    if (active || pill > 0) edges[edge] = { active, pill };
  }
  return edges;
}

// 표시 시각 d에서 키별 후광 세기(0보다 큰 것만). 같은 키의 후광이 겹쳐도 가장 센 하나만 쓴다(더하지 않는다).
// 키마다 이분 탐색으로 아직 끝나지 않은 첫 후광을 찾고 시작 전까지 훑는다.
function pulsesAt(scene, d) {
  const out = {};
  for (const [key, onsets] of scene.pulses) {
    let level = 0;
    for (let i = firstAtLeast(onsets, scene.t0 + (d - scene.timing.tailMs) * scene.speed); i < onsets.length; i++) {
      const x = d - (onsets[i] - scene.t0) / scene.speed;
      if (x < 0) break;
      level = Math.max(level, envelope(x, scene.timing));
    }
    if (level > 0) out[key] = level;
  }
  return out;
}

// 오름차순 목록에서 value 이상인 첫 번호. 모두 작으면 길이다.
function firstAtLeast(sorted, value) {
  let [low, high] = [0, sorted.length];
  while (low < high) {
    const mid = (low + high) >> 1;
    if (sorted[mid] < value) low = mid + 1;
    else high = mid;
  }
  return low;
}

// 후광이 시작한 뒤 x ms(표시 시각)의 세기. 0에서 rise 동안 1로 오르고, hold 동안 1이고, decay 동안 0으로 내린다.
function envelope(x, { riseMs, holdMs, decayMs }) {
  if (x < 0) return 0;
  if (x < riseMs) return x / riseMs;
  if (x < riseMs + holdMs) return 1;
  const falling = x - riseMs - holdMs;
  return falling < decayMs ? 1 - falling / decayMs : 0;
}

// 논리 시각 at에 값 줄마다 보일 글. 이 장면의 줄이 아니면 없다. 시각이 든 기간의 글이고, 어느 기간에도 들지 않으면(같은 시각의 중간 기록 뒤, 끝 이후) 마지막 기록이다.
function valuesAt(data, si, at) {
  return (data.values ?? []).map((row) => (row.si === si ? (row.periods.find(([from, to]) => at >= from && at < to) ?? row.periods.at(-1))[2] : undefined));
}

// 차트 카드마다 보일 틀 번호. 이 장면에 시간표 행이 있으면 그 기간의 틀이고(기간에 들지 않으면 마지막 기간), 행이 없으면 처음 틀(0번, 값이 시작할 때의 그림)이다.
function chartsAt(data, si, at) {
  return Object.fromEntries(
    Object.keys(data.chartFrames ?? {}).map((cardId) => {
      const periods = data.charts?.[cardId]?.rows.find((row) => row.si === si)?.periods;
      return [cardId, periods?.length ? (periods.find(([from, to]) => at >= from && at < to) ?? periods.at(-1))[2] : 0];
    }),
  );
}

// 브라우저에서 돈다(play.js와 한 스크립트로 이어 붙는다). 값 카드 줄의 값 글자와 바뀐 값의 배경 후광을 그린다.
// 글자 요소는 값마다 하나씩 미리 그려져 있고, 모습(frame.values)이 가리키는 글과 같은 글자 요소만 보인다. 어느 글을 보일지는 표본 추출기가 정한다.
// 같은 카드가 여러 판에 그려지면 값 글자와 배경 후광 요소가 판마다 한 벌씩 있고(data-v, data-vf는 같다), 모두 같은 값으로 쓴다. 값 쓰기는 논리 사건 하나다.

// 값 줄마다 그림 안의 글자 요소 목록과 배경 후광 요소 목록을 한 번 찾아 둔다.
function createValueEls(view, data) {
  return (data.values ?? []).map((_, vi) => ({ texts: [...view.querySelectorAll(`[data-v="${vi}"]`)], flashes: [...view.querySelectorAll(`[data-vf="${vi}"]`)] }));
}

// 보이는 글이 바뀐 카드 글 줄의 배경 후광 요소를 줄마다(`도형 id:줄 번호`) 한 번 찾아 둔다. 같은 카드가 여러 판에 그려져도 줄 하나는 논리 사건 하나다.
function createRowEls(view) {
  const rows = new Map();
  for (const el of view.querySelectorAll('[data-rf]')) rows.set(el.dataset.rf, [...(rows.get(el.dataset.rf) ?? []), el]);
  return rows;
}

/**
 * 값 줄을 그린다. 이 장면의 줄이 아니면(frame.values가 없음) 모든 글자가 꺼진다.
 * 배경 후광은 실제로 글이 바뀐 줄만 켜지고(`value:줄 번호` 후광) 불투명도가 후광 세기다.
 */
function paintValues(stage, frame) {
  stage.valueEls.forEach(({ texts, flashes }, vi) => {
    for (const el of texts) showVariant(stage, el, el.dataset.t === frame.values[vi]);
    for (const el of flashes) writeAttr(stage, el, 'opacity', frame.pulses[`value:${vi}`] ?? 0);
  });
  // 글 줄의 배경 후광은 보이는 글이 실제로 바뀐 줄(`row:도형:줄`)만 켜진다. 카드 전체나 지운 줄은 켜지 않는다.
  for (const [key, els] of stage.rowEls) for (const el of els) writeAttr(stage, el, 'opacity', frame.pulses[`row:${key}`] ?? 0);
}
